<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>soundmarks</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@300;400;600&family=Overpass+Mono:wght@300;400&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f8f8f6;--surf:#ffffff;--rule:#dedbd4;--rule2:#eeecea;
  --text:#1a1a16;--dim:#5a5854;--faint:#9a9890;
  --serif:'Cormorant',Georgia,serif;
  --mono:'Overpass Mono',monospace;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--mono);overflow:hidden;}
#shell{display:grid;grid-template-rows:auto auto 1fr;height:100vh;}

/* header */
#hd{display:flex;align-items:center;justify-content:space-between;padding:1.2rem 2rem;border-bottom:1px solid var(--rule);gap:1rem;background:var(--bg);}
#wordmark{font-family:var(--serif);font-weight:600;font-size:clamp(1.8rem,4vw,3rem);letter-spacing:0.2em;color:var(--text);text-transform:uppercase;}
#hd-right{display:flex;align-items:center;gap:1rem;}
#mark-count{font-size:0.62rem;color:var(--dim);letter-spacing:0.08em;text-transform:uppercase;white-space:nowrap;}
#mark-count b{color:var(--text);}
.hd-divider{width:1px;height:1.2rem;background:var(--rule);}
.view-btn{font-family:var(--mono);font-size:0.6rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--dim);background:none;border:none;cursor:pointer;padding:0.2rem 0;border-bottom:1px solid transparent;transition:all 0.1s;}
.view-btn.on{color:var(--text);border-bottom-color:var(--text);}
.view-btn:hover{color:var(--text);}
.theme-btn{font-family:var(--mono);font-size:0.58rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--dim);background:none;border:1px solid var(--rule);cursor:pointer;padding:0.22rem 0.55rem;transition:all 0.1s;}
.theme-btn:hover{border-color:var(--dim);color:var(--text);}
.theme-btn.on{background:var(--text);color:var(--bg);border-color:var(--text);}

/* filter bar */
#fbar{display:flex;align-items:center;padding:0.4rem 2rem;border-bottom:1px solid var(--rule2);overflow-x:auto;gap:0;background:var(--bg);}
#fbar::-webkit-scrollbar{display:none;}
.fl{font-size:0.55rem;color:var(--faint);margin-right:1rem;letter-spacing:0.12em;text-transform:uppercase;white-space:nowrap;flex-shrink:0;}
.fc{font-size:0.58rem;color:var(--dim);background:none;border:none;cursor:pointer;padding:0.25rem 0.7rem 0.25rem 0;white-space:nowrap;transition:color 0.1s;border-bottom:1px solid transparent;letter-spacing:0.1em;text-transform:uppercase;}
.fc.on{color:var(--text);border-bottom-color:var(--text);}
.fc:hover{color:var(--text);}

/* map */
#stage{position:relative;overflow:hidden;}
#map{width:100%;height:100%;}
.leaflet-tile-pane{filter:saturate(0.7) brightness(1.01);}
.leaflet-control-zoom{border:1px solid var(--rule)!important;border-radius:0!important;box-shadow:none!important;}
.leaflet-control-zoom a{background:var(--surf)!important;color:var(--text)!important;border-color:var(--rule)!important;border-radius:0!important;font-family:var(--mono)!important;font-weight:300!important;width:26px!important;height:26px!important;line-height:24px!important;}
.leaflet-control-zoom a:hover{background:var(--text)!important;color:var(--bg)!important;}
.leaflet-control-attribution{background:rgba(248,248,246,0.9)!important;color:var(--faint)!important;font-family:var(--mono)!important;font-size:0.5rem!important;}
.leaflet-control-attribution a{color:var(--faint)!important;}
.leaflet-popup-content-wrapper{background:var(--surf);border:1px solid var(--rule);border-radius:0;box-shadow:3px 3px 0 var(--rule2);padding:0;font-family:var(--mono);}
.leaflet-popup-content{margin:0;width:auto!important;}
.leaflet-popup-tip-container{display:none;}
.leaflet-popup-close-button{color:var(--dim)!important;top:10px!important;right:12px!important;}
.leaflet-popup-close-button:hover{color:var(--text)!important;}

/* hint */
#hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:var(--surf);border:1px solid var(--rule);padding:0.28rem 0.9rem;font-size:0.56rem;color:var(--dim);z-index:700;pointer-events:none;letter-spacing:0.1em;text-transform:uppercase;white-space:nowrap;}

/* search */
#sbox{position:absolute;top:10px;right:10px;z-index:700;display:flex;flex-direction:column;width:240px;}
#sbox-row{display:flex;border:1px solid var(--rule);background:var(--surf);}
#si{padding:0.38rem 0.65rem;font-size:0.62rem;font-family:var(--mono);background:none;border:none;color:var(--text);outline:none;flex:1;}
#si::placeholder{color:var(--faint);}
#sb{padding:0.38rem 0.65rem;background:var(--rule);color:var(--dim);border:none;font-family:var(--mono);font-size:0.62rem;cursor:pointer;letter-spacing:0.08em;text-transform:uppercase;}
#sb:hover{background:var(--text);color:var(--bg);}
#sugs{background:var(--surf);border:1px solid var(--rule);border-top:none;display:none;flex-direction:column;max-height:200px;overflow-y:auto;}
#sugs.open{display:flex;}
.sug{padding:0.45rem 0.65rem;font-size:0.58rem;color:var(--dim);cursor:pointer;border-bottom:1px solid var(--rule2);line-height:1.4;}
.sug:last-child{border-bottom:none;}
.sug:hover{background:var(--rule2);color:var(--text);}
.sug-main{color:var(--text);font-size:0.62rem;}
.sug-sub{font-size:0.52rem;color:var(--faint);margin-top:0.08rem;}

/* animated markers */
.sm-marker{position:relative;display:flex;align-items:center;justify-content:center;}
.sm-dot{border-radius:50%;position:relative;z-index:2;flex-shrink:0;}
.sm-ring{position:absolute;border-radius:50%;border:1px solid currentColor;top:50%;left:50%;transform:translate(-50%,-50%);animation:ripple 2.4s ease-out infinite;opacity:0;}
.sm-ring:nth-child(2){animation-delay:0s;}
.sm-ring:nth-child(3){animation-delay:0.8s;}
.sm-ring:nth-child(4){animation-delay:1.6s;}
@keyframes ripple{0%{width:var(--dot-size);height:var(--dot-size);opacity:0.65;}100%{width:calc(var(--dot-size)*4.5);height:calc(var(--dot-size)*4.5);opacity:0;}}

/* list view */
#listv{display:none;position:absolute;inset:0;background:var(--bg);overflow-y:auto;z-index:600;}
#listv.on{display:block;}
#listv-inner{padding:2rem;max-width:1000px;}
.l-empty{padding:3rem 0;color:var(--dim);font-size:0.75rem;}
.l-head{display:grid;grid-template-columns:2.2fr 1fr 0.8fr 0.7fr 0.5fr auto auto;gap:1rem;padding:0 0 0.6rem;font-size:0.54rem;color:var(--faint);letter-spacing:0.14em;text-transform:uppercase;border-bottom:1px solid var(--text);}
.l-row{display:grid;grid-template-columns:2.2fr 1fr 0.8fr 0.7fr 0.5fr auto auto;gap:1rem;align-items:center;padding:0.75rem 0;border-bottom:1px solid var(--rule2);}
.l-title{font-family:var(--serif);font-size:1.1rem;font-weight:400;color:var(--text);line-height:1.2;}
.l-sub{font-size:0.62rem;color:var(--dim);margin-top:0.1rem;}
.l-loc{color:var(--dim);font-size:0.6rem;}
.l-int{color:var(--dim);font-size:0.6rem;}
.l-audio-btn{background:none;border:1px solid var(--rule);color:var(--dim);cursor:pointer;font-size:0.56rem;font-family:var(--mono);padding:0.18rem 0.45rem;letter-spacing:0.06em;text-transform:uppercase;}
.l-audio-btn:hover{border-color:var(--text);color:var(--text);}
.l-del{background:none;border:none;color:var(--faint);cursor:pointer;font-size:0.85rem;font-family:var(--mono);}
.l-del:hover{color:#a03030;}

/* modal */
#mo{display:none;position:fixed;inset:0;z-index:2000;background:rgba(200,198,194,0.7);backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:1rem;}
#mo.on{display:flex;}
#md{background:var(--surf);border:1px solid var(--rule);width:100%;max-width:480px;max-height:92vh;overflow-y:auto;box-shadow:5px 5px 0 var(--rule);animation:pop 0.15s ease;}
@keyframes pop{from{transform:translate(3px,6px);opacity:0}to{transform:translate(0,0);opacity:1}}
.md-head{padding:1.2rem 1.4rem 1rem;border-bottom:1px solid var(--rule);display:flex;align-items:flex-start;justify-content:space-between;position:sticky;top:0;background:var(--surf);z-index:1;}
.md-label{font-size:0.54rem;color:var(--dim);letter-spacing:0.16em;text-transform:uppercase;margin-bottom:0.3rem;}
.md-coords{font-family:var(--serif);font-weight:300;font-size:1.5rem;color:var(--text);line-height:1;}
.md-place{font-size:0.68rem;color:var(--dim);margin-top:0.25rem;}
.md-x{background:none;border:none;font-size:1.1rem;color:var(--faint);cursor:pointer;line-height:1;}
.md-x:hover{color:var(--text);}
.md-body{padding:1.1rem 1.4rem;}
.md-field{margin-bottom:0.9rem;}
.md-field label{display:block;font-size:0.54rem;color:var(--dim);letter-spacing:0.14em;text-transform:uppercase;margin-bottom:0.35rem;}
.md-field input[type=text],.md-field textarea{width:100%;background:none;border:none;border-bottom:1px solid var(--rule);padding:0.3rem 0;font-size:0.95rem;font-family:var(--serif);font-weight:300;color:var(--text);outline:none;resize:none;transition:border-color 0.15s;}
.md-field input[type=text]:focus,.md-field textarea:focus{border-bottom-color:var(--text);}
.md-field input[type=text]::placeholder,.md-field textarea::placeholder{color:var(--dim);}
.md-field textarea{height:56px;}
.md-field input[type=range]{-webkit-appearance:none;width:100%;height:1px;background:var(--rule);margin:0.6rem 0 0.2rem;cursor:pointer;}
.md-field input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:9px;height:9px;background:var(--text);border-radius:50%;}
.int-row{display:flex;justify-content:space-between;font-size:0.54rem;color:var(--faint);letter-spacing:0.06em;}
.int-val{font-size:0.82rem;color:var(--dim);}
.cat-row{display:flex;flex-wrap:wrap;gap:0.28rem;margin-top:0.28rem;}
.cb{font-size:0.58rem;padding:0.22rem 0.55rem;border:1px solid var(--rule);background:none;color:var(--dim);cursor:pointer;letter-spacing:0.08em;text-transform:uppercase;transition:all 0.1s;}
.cb.on{background:var(--text);color:var(--bg);border-color:var(--text);}
.cb:hover:not(.on){border-color:var(--text);color:var(--text);}
.audio-zone{border:1px dashed var(--rule);padding:0.8rem;text-align:center;cursor:pointer;position:relative;transition:border-color 0.15s;}
.audio-zone:hover,.audio-zone.drag{border-color:var(--dim);}
.audio-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.audio-zone-lbl{font-size:0.75rem;color:var(--dim);pointer-events:none;}
.audio-zone-lbl b{color:var(--text);font-weight:400;}
.audio-preview{margin-top:0.4rem;display:flex;align-items:center;gap:0.5rem;}
.audio-name{font-size:0.6rem;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px;}
.audio-clear{background:none;border:none;color:var(--faint);cursor:pointer;font-size:0.8rem;}
.audio-clear:hover{color:#a03030;}
.md-foot{display:flex;gap:0.5rem;padding:0 1.4rem 1.2rem;}
.btn-c{padding:0.5rem 1rem;background:none;border:1px solid var(--rule);color:var(--dim);font-family:var(--mono);font-size:0.6rem;cursor:pointer;letter-spacing:0.1em;text-transform:uppercase;}
.btn-c:hover{border-color:var(--text);color:var(--text);}
.btn-s{flex:1;padding:0.5rem 1rem;background:var(--text);border:1px solid var(--text);color:var(--bg);font-family:var(--mono);font-size:0.6rem;cursor:pointer;letter-spacing:0.1em;text-transform:uppercase;}
.btn-s:hover{opacity:0.82;}
.btn-s:disabled{background:var(--rule);border-color:var(--rule);color:var(--faint);cursor:not-allowed;opacity:1;}

/* popup */
.pu{padding:1.1rem 1.3rem 1rem;min-width:320px;max-width:360px;}
.pu-cat{font-size:0.54rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--dim);margin-bottom:0.3rem;}
.pu-title{font-family:var(--serif);font-weight:400;font-size:1.2rem;color:var(--text);margin-bottom:0.2rem;line-height:1.2;}
.pu-loc{font-size:0.64rem;color:var(--dim);margin-bottom:0.2rem;}
.pu-coords{font-family:var(--mono);font-size:0.54rem;color:var(--faint);margin-bottom:0.45rem;letter-spacing:0.04em;}
.pu-desc{font-size:0.7rem;color:var(--dim);line-height:1.55;margin-bottom:0.5rem;}
.pu-audio{margin-bottom:0.5rem;}
.pu-audio audio{display:none;}
.custom-player{display:flex;align-items:center;gap:0.5rem;padding:0.4rem 0;}
.cp-btn{background:none;border:1px solid var(--rule);color:var(--text);cursor:pointer;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:0.85rem;flex-shrink:0;transition:all 0.1s;}
.cp-btn:hover{background:var(--text);color:var(--bg);}
.cp-track{flex:1;height:80px;background:transparent;position:relative;cursor:pointer;}
.cp-canvas{position:absolute;inset:0;width:100%;height:100%;}
.cp-fill{position:absolute;top:0;left:0;height:100%;width:0%;background:rgba(0,0,0,0.06);pointer-events:none;transition:width 0.05s linear;}
.cp-playhead{position:absolute;top:0;width:1.5px;height:100%;background:var(--text);pointer-events:none;left:0%;}
.cp-time{font-family:var(--mono);font-size:0.52rem;color:var(--dim);white-space:nowrap;min-width:32px;text-align:right;}
.pu-meta{display:flex;gap:0.5rem;font-size:0.56rem;color:var(--faint);flex-wrap:wrap;padding-top:0.4rem;border-top:1px solid var(--rule);}

::-webkit-scrollbar{width:2px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--rule);}

/* mobile */
@media(max-width:640px){
  /* Header — two rows on mobile */
  #hd{flex-wrap:wrap;padding:0.75rem 1rem;gap:0.5rem;}
  #wordmark{font-size:1.6rem;letter-spacing:0.15em;flex:1;}
  #hd-right{width:100%;justify-content:space-between;gap:0.5rem;flex-wrap:wrap;}
  #mark-count{display:none;}
  .hd-divider{display:none;}
  .view-btn{font-size:0.7rem;min-height:36px;padding:0.3rem 0.5rem;}
  .theme-btn{font-size:0.65rem;min-height:36px;padding:0.3rem 0.6rem;}

  /* Filter bar — scrollable, bigger tap targets */
  #fbar{padding:0 1rem;min-height:36px;}
  .fl{display:none;}
  .fc{font-size:0.65rem;padding:0 0.7rem;min-height:36px;line-height:36px;}

  /* Search — full width, below map controls */
  #sbox{width:calc(100% - 16px);left:8px;right:8px;top:8px;}
  #si{font-size:0.75rem;padding:0.55rem 0.7rem;}
  #sb{font-size:0.7rem;padding:0.55rem 0.7rem;min-height:40px;}
  .sug{padding:0.6rem 0.7rem;font-size:0.68rem;}
  .sug-main{font-size:0.72rem;}

  /* Hint */
  #hint{font-size:0.6rem;bottom:10px;padding:0.25rem 0.7rem;}

  /* Modal — full screen sheet from bottom */
  #mo{padding:0;align-items:flex-end;}
  #md{max-width:100%;max-height:90vh;border-left:none;border-right:none;border-bottom:none;box-shadow:0 -3px 12px rgba(0,0,0,0.08);border-radius:0;}
  .md-head{padding:1rem 1.1rem 0.8rem;}
  .md-coords{font-size:1.3rem;}
  .md-body{padding:0.8rem 1.1rem;}
  .md-field{margin-bottom:0.75rem;}
  .md-field label{font-size:0.6rem;}
  .md-field input[type=text],.md-field textarea{font-size:1rem;padding:0.4rem 0;}
  .md-field textarea{height:52px;}
  .cat-row{gap:0.35rem;}
  .cb{font-size:0.68rem;padding:0.35rem 0.65rem;min-height:36px;}
  .md-foot{padding:0.5rem 1.1rem 1.2rem;gap:0.4rem;}
  .btn-c,.btn-s{font-size:0.68rem;min-height:46px;padding:0.6rem 1rem;}

  /* Audio recorder */
  .audio-tab{font-size:0.65rem;padding:0.35rem 0.8rem 0.35rem 0;min-height:36px;}
  #rec-btn{font-size:0.65rem;min-height:40px;padding:0.4rem 0.8rem;}
  #rec-timer{font-size:0.68rem;}

  /* Index list */
  #listv-inner{padding:0.8rem 1rem;}
  .l-head{display:none;}
  .l-row{grid-template-columns:1fr auto;grid-template-rows:auto auto;gap:0.3rem 0.5rem;padding:0.65rem 0;}
  .l-loc,.l-int{display:none;}
  .l-title{font-size:1rem;}
  .l-del{font-size:1rem;min-height:36px;min-width:36px;}
}

/* ── Recorder ── */
.audio-tabs{display:flex;gap:0;margin-bottom:0.5rem;border-bottom:1px solid var(--rule);}
.audio-tab{font-family:var(--mono);font-size:0.56rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--dim);background:none;border:none;cursor:pointer;padding:0.3rem 0.7rem 0.3rem 0;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all 0.1s;}
.audio-tab.on{color:var(--text);border-bottom-color:var(--text);}
.audio-tab:hover{color:var(--text);}
.audio-panel{display:none;}
.audio-panel.on{display:block;}
#rec-controls{display:flex;align-items:center;gap:0.6rem;padding:0.6rem 0;}
#rec-btn{font-family:var(--mono);font-size:0.58rem;letter-spacing:0.1em;text-transform:uppercase;background:none;border:1px solid var(--rule);color:var(--dim);cursor:pointer;padding:0.35rem 0.7rem;transition:all 0.1s;display:flex;align-items:center;gap:0.4rem;}
#rec-btn:hover{border-color:var(--text);color:var(--text);}
#rec-btn.recording{border-color:#c03030;color:#c03030;}
#rec-dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0;}
#rec-btn.recording #rec-dot{animation:blink 0.9s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.2;}}
#rec-timer{font-family:var(--mono);font-size:0.62rem;color:var(--dim);min-width:40px;}
#rec-preview{margin-top:0.4rem;display:none;flex-direction:column;gap:0.4rem;}
#rec-preview.on{display:flex;}
#rec-audio{width:100%;height:36px;accent-color:var(--text);}
#rec-discard{font-family:var(--mono);font-size:0.56rem;color:var(--faint);background:none;border:none;cursor:pointer;text-decoration:underline;text-align:left;letter-spacing:0.04em;}
#rec-discard:hover{color:#a03030;}

/* ── Live waveform visualizer ── */
#rec-canvas-wrap{display:none;margin:0.4rem 0;border:1px solid var(--rule);background:var(--surf);height:52px;overflow:hidden;}
#rec-canvas-wrap.on{display:block;}
#rec-canvas{width:100%;height:52px;display:block;}

/* locate button */
#locate-btn{position:absolute;top:80px;left:10px;z-index:700;width:26px;height:26px;background:var(--surf);border:1px solid var(--rule);color:var(--dim);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:0.9rem;transition:all 0.1s;}
#locate-btn:hover{background:var(--text);color:var(--bg);}
#locate-btn.locating{animation:spin 1s linear infinite;color:var(--text);}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}

/* admin */
#admin-bar{display:none;background:#c03030;color:#fff;font-family:var(--mono);font-size:0.58rem;letter-spacing:0.12em;text-transform:uppercase;padding:0.28rem 1.2rem;align-items:center;justify-content:space-between;position:fixed;top:0;left:0;right:0;z-index:3000;}
#admin-bar.on{display:flex;}
#admin-exit{background:none;border:1px solid rgba(255,255,255,0.5);color:#fff;font-family:var(--mono);font-size:0.55rem;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;padding:0.2rem 0.6rem;}
#admin-exit:hover{background:rgba(255,255,255,0.2);}
.l-del-btn{background:none;border:none;color:rgba(192,48,48,0.5);cursor:pointer;font-size:0.9rem;font-family:var(--mono);padding:0 0.2rem;transition:color 0.1s;}
.l-del-btn:hover{color:#c03030;}
.pu-del-btn{width:100%;background:none;border:1px solid rgba(192,48,48,0.35);color:#c03030;font-family:var(--mono);font-size:0.55rem;cursor:pointer;padding:0.35rem;letter-spacing:0.1em;text-transform:uppercase;margin-top:0.5rem;display:block;}
.pu-del-btn:hover{background:rgba(192,48,48,0.08);}

/* index toolbar */
#list-toolbar{display:flex;align-items:center;gap:0.6rem;padding:0.7rem 0 0.9rem;flex-wrap:wrap;}
.sort-btn{font-family:var(--mono);font-size:0.55rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--dim);background:none;border:1px solid var(--rule);cursor:pointer;padding:0.22rem 0.55rem;transition:all 0.1s;}
.sort-btn.on{background:var(--text);color:var(--bg);border-color:var(--text);}
.sort-btn:hover:not(.on){border-color:var(--dim);color:var(--text);}
#toolbar-divider{width:1px;height:1.1rem;background:var(--rule);margin:0 0.2rem;}
#export-btn{font-family:var(--mono);font-size:0.55rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--dim);background:none;border:1px solid var(--rule);cursor:pointer;padding:0.22rem 0.55rem;transition:all 0.1s;display:flex;align-items:center;gap:0.3rem;}
#export-btn:hover{border-color:var(--dim);color:var(--text);}
#export-btn.has-sel{border-color:#4a7abf;color:#4a7abf;}
#sel-count{font-family:var(--mono);font-size:0.55rem;color:var(--faint);letter-spacing:0.06em;}
.l-check{width:16px;height:16px;cursor:pointer;accent-color:var(--text);}
.l-row.selected{background:rgba(74,122,191,0.06);}

/* drag select & map export */
#drag-box{position:absolute;border:1.5px dashed #4a7abf;background:rgba(74,122,191,0.08);pointer-events:none;display:none;z-index:650;}
#map-toolbar{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:700;display:flex;gap:0;align-items:center;background:var(--surf);border:1px solid var(--rule);}
.map-tool-btn{font-family:var(--mono);font-size:0.55rem;letter-spacing:0.1em;text-transform:uppercase;background:none;border:none;border-right:1px solid var(--rule);color:var(--dim);cursor:pointer;padding:0.28rem 0.7rem;white-space:nowrap;transition:all 0.1s;}
.map-tool-btn:last-child{border-right:none;}
.map-tool-btn:hover{background:var(--rule2);color:var(--text);}
.map-tool-btn.on{background:var(--text);color:var(--bg);}
.map-tool-btn.export{color:#5a9a6a;}
.map-tool-btn.export:hover{background:#5a9a6a;color:#fff;}
#sel-badge{background:#4a7abf;color:#fff;font-family:var(--mono);font-size:0.52rem;padding:0.28rem 0.55rem;letter-spacing:0.06em;display:none;border-right:1px solid rgba(255,255,255,0.2);}
#sel-badge.on{display:inline-block;}
#hint{display:none;}

/* audio controls */
.cp-controls{display:flex;gap:0.6rem;padding:0.3rem 0 0.1rem;align-items:center;flex-wrap:wrap;}
.cp-ctrl{display:flex;flex-direction:column;align-items:center;gap:0.15rem;min-width:36px;}
.cp-ctrl-label{font-family:var(--mono);font-size:0.46rem;color:var(--faint);letter-spacing:0.1em;text-transform:uppercase;}
input[type=range].cp-slider{-webkit-appearance:none;width:100%;height:1px;background:var(--rule);cursor:pointer;outline:none;}
input[type=range].cp-slider::-webkit-slider-thumb{-webkit-appearance:none;width:8px;height:8px;background:var(--text);border-radius:50%;}
.cp-vol{flex:1;min-width:60px;}
.cp-eq{display:flex;gap:0.5rem;align-items:center;}
.cp-eq-label{font-family:var(--mono);font-size:0.46rem;color:var(--faint);letter-spacing:0.1em;text-transform:uppercase;white-space:nowrap;}
</style>

    <div id="map-toolbar">

<script>
var CATS=[
  {id:'natural',label:'Natural'},{id:'rural',label:'Rural'},{id:'urban',label:'Urban'},
  {id:'human',label:'Human'},{id:'mechanical',label:'Mechanical'},
  {id:'ambient',label:'Ambient'},{id:'silence',label:'Silence'}
];
var INT=['Very Quiet','Quiet','Moderate','Loud','Very Loud'];
var COL={natural:'#4a8a5a',rural:'#8a6a30',urban:'#b86830',human:'#3a6aaf',mechanical:'#904070',ambient:'#6a50b0',silence:'#606058'};

// Firebase

/*
 FIREBASE DATABASE RULES — paste into Firebase Console > Realtime Database > Rules:

{
  "rules": {
    "marks": {
      ".read": true,
      "$markId": {
        ".write": "!data.exists() || auth == null",
        ".validate": "newData.hasChildren(['id','title','lat','lng','category','date'])
          && newData.child('title').isString()
          && newData.child('title').val().length <= 500
          && newData.child('lat').isNumber()
          && newData.child('lng').isNumber()
          && newData.child('lat').val() >= -90 && newData.child('lat').val() <= 90
          && newData.child('lng').val() >= -180 && newData.child('lng').val() <= 180
          && newData.child('category').val().matches(/^(natural|rural|urban|human|mechanical|ambient|silence)$/)
          && newData.child('intensity').isNumber()
          && newData.child('intensity').val() >= 1 && newData.child('intensity').val() <= 5"
      }
    }
  }
}

 FIREBASE STORAGE RULES — paste into Firebase Console > Storage > Rules:

rules_version = '2';
service firebase.storage {
  match /b/{bucket}/o {
    match /audio/{filename} {
      allow read: if true;
      allow write: if request.resource.size < 10 * 1024 * 1024
        && request.resource.contentType.matches('audio/.*');
    }
  }
}
*/
var firebaseConfig={
  apiKey:"AIzaSyB21-WZ4iGXvcbKKokrTTuAEj51F-Ath5Q",
  authDomain:"a-soundmarks.firebaseapp.com",
  databaseURL:"https://a-soundmarks-default-rtdb.firebaseio.com",
  projectId:"a-soundmarks",
  storageBucket:"a-soundmarks.firebasestorage.app",
  messagingSenderId:"1054648701354",
  appId:"1:1054648701354:web:85713f608d0a72cfb51bd3"
};
firebase.initializeApp(firebaseConfig);
var db=firebase.database();
var storage=firebase.storage();

var marks=[];
var filt='all',plng=null,pplace='',scat='natural',lms={};

function enterAdmin(){
  isAdmin=true;
  document.getElementById('admin-bar').classList.add('on');
  rl();
  Object.keys(lms).forEach(function(id){
    var m=marks.find(function(x){return x.id===id;});
    if(m)lms[id].setPopupContent(puHTML(m));

function exitAdmin(){
  isAdmin=false;
  document.getElementById('admin-bar').classList.remove('on');
  rl();
  Object.keys(lms).forEach(function(id){
    var m=marks.find(function(x){return x.id===id;});
    if(m)lms[id].setPopupContent(puHTML(m));
  });
}

var map=L.map('map',{center:[20,0],zoom:2,minZoom:2,maxZoom:22});
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',maxZoom:22,maxNativeZoom:19
}).addTo(map);

// Live Firebase sync
marksRef.on('value',function(snap){
  marks=[];
  snap.forEach(function(child){
    var v=child.val();
    console.log('RAW Firebase child key:',child.key,'val:',JSON.stringify(v).slice(0,200));
    if(!v)return;
    if(!v.id)v.id=child.key;
    if(!v.title)v.title='Untitled';
    // Normalize position - handle array, object with numeric keys, or lat/lng fields
    if(!v.lat&&v.position){
      var p=v.position;
      if(Array.isArray(p)){v.lat=p[0];v.lng=p[1];}
      else{v.lat=p[0]||p['0'];v.lng=p[1]||p['1'];}
    }
    if(!v.category)v.category='ambient';
    if(v.intensity===undefined)v.intensity=2;
    console.log('Processed mark: lat='+v.lat+' lng='+v.lng+' title='+v.title);
    marks.push(v);
  });
  console.log('Total marks loaded:',marks.length);
  rm();
},function(err){
  console.error('Firebase error:',err);
  alert('Firebase error: '+err.message);
});

function rg(ll){
  return fetch('https://nominatim.openstreetmap.org/reverse?lat='+ll.lat+'&lon='+ll.lng+'&format=json')
    .then(function(r){return r.json();})
    .then(function(d){var a=d.address||{};return[a.city||a.town||a.village||a.hamlet||a.county,a.country].filter(Boolean).join(', ')||'';})
    .catch(function(){return '';});
}

// Search
var sugTimer=null;
var siEl=document.getElementById('si');
var sugsEl=document.getElementById('sugs');
siEl.addEventListener('input',function(){
  var q=siEl.value.trim();clearTimeout(sugTimer);
  if(q.length<2){closeSugs();return;}
  sugTimer=setTimeout(function(){
    fetch('https://nominatim.openstreetmap.org/search?q='+encodeURIComponent(q)+'&format=json&limit=6&addressdetails=1')
      .then(function(r){return r.json();})
      .then(function(results){
        sugsEl.innerHTML='';
        if(!results.length){closeSugs();return;}
        results.forEach(function(r){
          var parts=r.display_name.split(',');
          var main=parts.slice(0,2).join(',').trim();
          var sub=parts.slice(2,4).join(',').trim();
          var div=document.createElement('div');div.className='sug';
          div.innerHTML="<div class='sug-main'>"+main+"</div>"+(sub?"<div class='sug-sub'>"+sub+"</div>":"");
          div.addEventListener('click',function(){map.setView([+r.lat,+r.lon],12);siEl.value=main;closeSugs();});
          sugsEl.appendChild(div);
        });
        sugsEl.classList.add('open');
      }).catch(function(){});
  },280);
});
siEl.addEventListener('keydown',function(e){if(e.key==='Enter')sp();if(e.key==='Escape')closeSugs();});
document.addEventListener('click',function(e){if(!document.getElementById('sbox').contains(e.target))closeSugs();});
function closeSugs(){sugsEl.classList.remove('open');sugsEl.innerHTML='';}
function sp(){
  var q=siEl.value.trim();if(!q)return;
  if(q.toLowerCase()==='archsound'){
    siEl.value='';closeSugs();
    isAdmin?exitAdmin():enterAdmin();
    return;
  }
  closeSugs();
  fetch('https://nominatim.openstreetmap.org/search?q='+encodeURIComponent(q)+'&format=json&limit=1')
    .then(function(r){return r.json();})
    .then(function(d){if(d.length)map.setView([+d[0].lat,+d[0].lon],12);else alert('Place not found.');})
    .catch(function(){alert('Search failed.');});
}

// Audio
function handleFile(file){
  if(!file)return;
  if(file.size > 20*1024*1024){alert('File is too large (max 20MB — about 6 minutes at standard quality). Please use a shorter recording.');return;}
  // Store blob directly for Storage upload — no base64 needed
  var blobUrl=URL.createObjectURL(file);
  pendingAudio={name:file.name,dataUrl:blobUrl,blob:file,isBlobUrl:true};
  document.getElementById('an').textContent=file.name;
  document.getElementById('ap').style.display='flex';
  document.getElementById('azl').style.display='none';
}
function handleDrop(e){
  e.preventDefault();document.getElementById('az').classList.remove('drag');
  var f=e.dataTransfer.files[0];if(f&&f.type.startsWith('audio/'))handleFile(f);
}
function clearAudio(){
  pendingAudio=null;document.getElementById('af').value='';
  document.getElementById('ap').style.display='none';
  document.getElementById('azl').style.display='block';
}

// Theme toggles
function applyTheme(){
  var sat=isSat?1:0;
  // Tile filter: invert map tiles in dark mode, always apply sat to tiles
  var tilef=isInv?'invert(1) hue-rotate(180deg) saturate('+(isSat?0.7:0)+') brightness(1.01)':'saturate('+(isSat?0.7:0)+') brightness(1.01)';
  document.querySelector('.leaflet-tile-pane').style.filter=tilef;
  // Only desaturate UI chrome (header, fbar, modal) — NOT the map or markers
  var uiSat='saturate('+sat+')';
  document.getElementById('hd').style.filter=uiSat;
  document.getElementById('fbar').style.filter=uiSat;
  document.getElementById('mo').style.filter=uiSat;
  // CSS variable swap for dark/light mode (affects all var() colors)
  var r=document.documentElement;
  if(isInv){
    r.style.setProperty('--bg','#111110');r.style.setProperty('--surf','#1c1c1a');
    r.style.setProperty('--rule','#303030');r.style.setProperty('--rule2','#242422');
    r.style.setProperty('--text','#f0ece4');r.style.setProperty('--dim','#aaa8a0');
    r.style.setProperty('--faint','#888480');
  } else {
    r.style.setProperty('--bg','#f8f8f6');r.style.setProperty('--surf','#ffffff');
    r.style.setProperty('--rule','#dedbd4');r.style.setProperty('--rule2','#eeecea');
    r.style.setProperty('--text','#1a1a16');r.style.setProperty('--dim','#5a5854');
    r.style.setProperty('--faint','#9a9890');
  }
}
function toggleSat(){
  isSat=!isSat;
  var btn=document.getElementById('sat-btn');
  btn.textContent=isSat?'Color':'Grey';
  btn.classList.toggle('on',isSat);

}
function toggleInvert(){

function mkIcon(cat,intensity,waveenv){
  var col=COL[cat]||'#888',dotPx=8+intensity*3,pad=dotPx*2.5,s=Math.round(dotPx+pad*2);
  var mid=s/2;
  if(waveenv&&waveenv.length){
    // Canvas marker — driven by waveform envelope
    var uid='wm-'+Math.random().toString(36).slice(2,8);
    var html="<canvas id='"+uid+"' width='"+s+"' height='"+s+"' style='display:block;'></canvas>";
    var icon=L.divIcon({html:html,className:'',iconSize:[s,s],iconAnchor:[mid,mid]});
    // Start animation after Leaflet adds the canvas to DOM
    setTimeout(function(){
      var canvas=document.getElementById(uid);
      if(!canvas)return;
      var ctx=canvas.getContext('2d');
      var env=waveenv;
      var frame=0;
      var fps=30;
      var loopLen=env.length;
      (function animate(){
        requestAnimationFrame(animate);
        ctx.clearRect(0,0,s,s);
        // Draw 3 rings whose radius pulses with envelope
        var t=frame%loopLen;
        for(var r=0;r<3;r++){
          var envIdx=Math.floor((t+(r*(loopLen/3)))%loopLen);
          var amp=env[envIdx];
          var radius=dotPx/2 + (pad*0.3) + amp*(pad*0.65);
          var opacity=0.15+amp*0.55;
          ctx.beginPath();
          ctx.arc(mid,mid,radius,0,Math.PI*2);
          ctx.strokeStyle=col;
          ctx.globalAlpha=opacity;
          ctx.lineWidth=1.2;
          ctx.stroke();
        }
        ctx.globalAlpha=1;
        // Center dot
        ctx.beginPath();
        ctx.arc(mid,mid,dotPx/2,0,Math.PI*2);
        ctx.fillStyle=col;
        ctx.globalAlpha=0.9;
        ctx.fill();
        ctx.globalAlpha=1;
        frame++;
      })();
    },120);
    return icon;
  } else {
    // No waveform — fall back to CSS ripple rings
    var speed=(2.8-intensity*0.3).toFixed(1);
    var html="<div class='sm-marker' style='width:"+s+"px;height:"+s+"px;'>"
      +"<div class='sm-ring' style='color:"+col+";--dot-size:"+dotPx+"px;animation-duration:"+speed+"s;'></div>"
      +"<div class='sm-ring' style='color:"+col+";--dot-size:"+dotPx+"px;animation-duration:"+speed+"s;'></div>"
      +"<div class='sm-ring' style='color:"+col+";--dot-size:"+dotPx+"px;animation-duration:"+speed+"s;'></div>"
      +"<div class='sm-dot' style='width:"+dotPx+"px;height:"+dotPx+"px;background:"+col+";opacity:0.9;'></div>"
      +"</div>";
    return L.divIcon({html:html,className:'',iconSize:[s,s],iconAnchor:[mid,mid]});
  }
}

// ── Recorder ──
var mediaRecorder=null, recChunks=[], recStream=null, recTimer=null, recSeconds=0;
var audioCtx=null, analyser=null, animFrame=null;

function toggleRecord(){
  if(mediaRecorder && mediaRecorder.state==='recording') stopRecording();
  else startRecording();
}

function startRecording(){
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    recStream=stream;
    recChunks=[];

    // Web Audio analyser
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    analyser=audioCtx.createAnalyser();
    analyser.fftSize=256;
    audioCtx.createMediaStreamSource(stream).connect(analyser);

    // Detect best mime type for this browser
    var mimeType='';
    var candidates=['audio/mp4','audio/aac','audio/webm;codecs=opus','audio/webm','audio/ogg'];
    for(var i=0;i<candidates.length;i++){
      try{if(MediaRecorder.isTypeSupported(candidates[i])){mimeType=candidates[i];break;}}catch(e){}
    }
    var recOpts=mimeType?{mimeType:mimeType}:{};
    try{mediaRecorder=new MediaRecorder(stream,recOpts);}
    catch(e){mediaRecorder=new MediaRecorder(stream);mimeType=mediaRecorder.mimeType||'audio/webm';}
    mediaRecorder.ondataavailable=function(e){if(e.data.size>0)recChunks.push(e.data);};
    mediaRecorder.onstop=function(){
      var blobType=mimeType||'audio/webm';
      var blob=new Blob(recChunks,{type:blobType});
      var ext=blobType.indexOf('mp4')!==-1?'mp4':blobType.indexOf('ogg')!==-1?'ogg':'webm';
      // Use blob URL for preview — works on all browsers including iOS Safari
      var blobUrl=URL.createObjectURL(blob);
      var audioEl=document.getElementById('rec-audio');
      audioEl.src=blobUrl;
      audioEl.load();
      document.getElementById('rec-preview').classList.add('on');
      // Store blob directly — Storage upload handles it, no base64 needed
      var blobUrl=URL.createObjectURL(blob);
      pendingAudio={name:'recording.'+ext,dataUrl:blobUrl,blob:blob,isBlobUrl:true};
    };
    mediaRecorder.start();

    recSeconds=0;
    document.getElementById('rec-timer').textContent='0:00';
    recTimer=setInterval(function(){
      recSeconds++;
      var m=Math.floor(recSeconds/60),s=recSeconds%60;
      document.getElementById('rec-timer').textContent=m+':'+(s<10?'0':'')+s;
    },1000);
    document.getElementById('rec-btn').classList.add('recording');
    document.getElementById('rec-label').textContent='Stop';

    // Show and start canvas
    var wrap=document.getElementById('rec-canvas-wrap');
    wrap.classList.add('on');
    drawWave();
  }).catch(function(){alert('Microphone access denied.');});
}

function drawWave(){
  var canvas=document.getElementById('rec-canvas');
  var W=canvas.offsetWidth, H=canvas.offsetHeight;
  canvas.width=W; canvas.height=H;
  var ctx=canvas.getContext('2d');
  var bufLen=analyser.frequencyBinCount;
  var dataArr=new Uint8Array(bufLen);

  function frame(){
    animFrame=requestAnimationFrame(frame);
    analyser.getByteTimeDomainData(dataArr);

    // background
    var bg=getComputedStyle(document.documentElement).getPropertyValue('--surf').trim()||'#fff';
    ctx.fillStyle=bg;
    ctx.fillRect(0,0,W,H);

    // draw waveform line
    ctx.lineWidth=1.5;
    ctx.strokeStyle='#c03030';
    ctx.beginPath();
    var sliceW=W/bufLen;
    var x=0;
    for(var i=0;i<bufLen;i++){
      var v=dataArr[i]/128.0;
      var y=v*H/2;
      if(i===0) ctx.moveTo(x,y);
      else ctx.lineTo(x,y);
      x+=sliceW;
    }
    ctx.lineTo(W,H/2);
    ctx.stroke();
  }
  frame();
}

function stopRecording(){
  if(mediaRecorder && mediaRecorder.state==='recording'){
    mediaRecorder.stop();
    recStream.getTracks().forEach(function(t){t.stop();});
    clearInterval(recTimer);
    cancelAnimationFrame(animFrame);
    if(audioCtx){audioCtx.close();audioCtx=null;analyser=null;}
    document.getElementById('rec-btn').classList.remove('recording');
    document.getElementById('rec-label').textContent='Record again';
    document.getElementById('rec-canvas-wrap').classList.remove('on');
  }
}

function discardRecording(){
  pendingAudio=null;
  document.getElementById('rec-audio').src='';
  document.getElementById('rec-preview').classList.remove('on');
  document.getElementById('rec-btn').classList.remove('recording');
  document.getElementById('rec-label').textContent='Record';
  document.getElementById('rec-timer').textContent='';
  document.getElementById('rec-canvas-wrap').classList.remove('on');
  recSeconds=0;
}

function locateMe(){
  if(!navigator.geolocation){alert('Geolocation not supported by this browser.');return;}
  var btn=document.getElementById('locate-btn');
  btn.classList.add('locating');

  navigator.geolocation.getCurrentPosition(
    function(pos){
      map.setView([pos.coords.latitude,pos.coords.longitude],15);
      btn.classList.remove('locating');

    },
    function(err){

      if(err.code===1)alert('Location permission denied. Please allow location access in your browser settings.');
      else alert('Could not get your location. Please try again.');
    },
    {enableHighAccuracy:true,timeout:10000,maximumAge:0}
  );
}

// ── Custom audio player with waveform ──
var _cpAudio=null, _cpPlayer=null;

function cpDrawWaveform(canvas, src){
  var actx=new(window.AudioContext||window.webkitAudioContext)();
  function drawDecoded(arrayBuf){
    actx.decodeAudioData(arrayBuf,function(decoded){
    var raw=decoded.getChannelData(0);
    var W=canvas.offsetWidth||240;
    var H=canvas.offsetHeight||40;
    canvas.width=W;canvas.height=H;
    var ctx=canvas.getContext('2d');
    var bars=Math.floor(W/2);
    var block=Math.floor(raw.length/bars);
    var mid=H/2;
    // Draw background waveform
    ctx.strokeStyle='var(--rule)';
    for(var i=0;i<bars;i++){
      var sum=0;
      for(var j=0;j<block;j++)sum+=Math.abs(raw[i*block+j]);
      var amp=(sum/block)*mid*3.8;
      amp=Math.min(amp,mid*0.92);
      var x=i*2+1;
      ctx.beginPath();
      ctx.lineWidth=1.2;
      ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--rule').trim()||'#ddd';
      ctx.moveTo(x,mid-amp);ctx.lineTo(x,mid+amp);ctx.stroke();
    }
    // Store bar data for progress coloring
    canvas._bars=bars;canvas._raw=raw;canvas._block=block;canvas._mid=mid;
      actx.close();
    },function(){actx.close();});
  }
  if(src.startsWith('data:')){
    var b64=src.split(',')[1];
    if(!b64){actx.close();return;}
    var bin=atob(b64);
    var u8=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
    drawDecoded(u8.buffer);
  } else {
    fetch(src).then(function(r){return r.arrayBuffer();}).then(drawDecoded)
      .catch(function(){actx.close();});
  }
}

function cpColorWaveform(canvas,progress){
  if(!canvas._bars)return;
  var raw=canvas._raw,block=canvas._block,bars=canvas._bars,mid=canvas._mid;
  var W=canvas.width,H=canvas.height;
  var ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,W,H);
  var textCol=getComputedStyle(document.documentElement).getPropertyValue('--text').trim()||'#1a1a18';
  var ruleCol=getComputedStyle(document.documentElement).getPropertyValue('--rule').trim()||'#ddd';
  var playedBars=Math.floor(bars*progress);
  for(var i=0;i<bars;i++){
    var sum=0;
    for(var j=0;j<block;j++)sum+=Math.abs(raw[i*block+j]);
    var amp=(sum/block)*mid*3.8;amp=Math.min(amp,mid*0.92);
    var x=i*2+1;
    ctx.beginPath();ctx.lineWidth=1.2;
    ctx.strokeStyle=i<playedBars?textCol:ruleCol;
    ctx.moveTo(x,mid-amp);ctx.lineTo(x,mid+amp);ctx.stroke();
  }
}

var _cpCtx=null,_cpGain=null,_cpLow=null,_cpMid=null,_cpHi=null;
var _cpSource=null,_cpBuffer=null,_cpStartTime=0,_cpOffset=0,_cpPlaying=false,_cpDuration=0;
var _cpRaf=null;

function cpTeardown(){
  cpStop();
  if(_cpAudio&&_cpAudio.pause){try{_cpAudio.pause();}catch(e){}}_cpAudio=null;
  if(_cpCtx){try{_cpCtx.close();}catch(e){}}_cpCtx=null;
  _cpGain=null;_cpLow=null;_cpMid=null;_cpHi=null;
  _cpBuffer=null;_cpSource=null;_cpOffset=0;_cpPlaying=false;_cpDuration=0;
}

function cpStop(){
  if(_cpSource){try{_cpSource.stop();}catch(e){}}_cpSource=null;
  _cpPlaying=false;
  if(_cpRaf){cancelAnimationFrame(_cpRaf);_cpRaf=null;}
}

function cpBuildChain(){
  _cpGain=_cpCtx.createGain();
  _cpLow=_cpCtx.createBiquadFilter();_cpLow.type='lowshelf';_cpLow.frequency.value=200;
  _cpMid=_cpCtx.createBiquadFilter();_cpMid.type='peaking';_cpMid.frequency.value=1000;_cpMid.Q.value=1;
  _cpHi=_cpCtx.createBiquadFilter();_cpHi.type='highshelf';_cpHi.frequency.value=4000;
  _cpLow.connect(_cpMid);_cpMid.connect(_cpHi);_cpHi.connect(_cpGain);_cpGain.connect(_cpCtx.destination);
}

function cpPlayFrom(offset){
  if(!_cpBuffer||!_cpCtx)return;
  cpStop();
  _cpSource=_cpCtx.createBufferSource();
  _cpSource.buffer=_cpBuffer;
  _cpSource.connect(_cpLow);
  _cpOffset=offset;
  _cpStartTime=_cpCtx.currentTime;
  _cpSource.start(0,offset);
  _cpPlaying=true;
  _cpSource.onended=function(){
    if(_cpPlaying){
      _cpPlaying=false;
      if(_cpPlayer){
        _cpPlayer.querySelector('.cp-btn').innerHTML='&#9654;';
        var c=_cpPlayer.querySelector('.cp-canvas');
        if(c&&c._bars)cpColorWaveform(c,1);
      }
    }
  };
  cpAnimate2();
}

function cpCurrentTime(){
  if(!_cpCtx||!_cpPlaying)return _cpOffset;
  return _cpOffset+(_cpCtx.currentTime-_cpStartTime);
}

function cpAnimate2(){
  if(!_cpPlaying||!_cpPlayer)return;
  var t=cpCurrentTime();
  var progress=_cpDuration?Math.min(t/_cpDuration,1):0;
  var canvas=_cpPlayer.querySelector('.cp-canvas');
  if(canvas&&canvas._bars)cpColorWaveform(canvas,progress);
  var playhead=_cpPlayer.querySelector('.cp-playhead');
  if(playhead)playhead.style.left=(progress*100)+'%';
  var time=_cpPlayer.querySelector('.cp-time');
  var s=Math.floor(t);
  if(time)time.textContent=Math.floor(s/60)+':'+(s%60<10?'0':'')+s%60;
  _cpRaf=requestAnimationFrame(cpAnimate2);
}

function cpCtrl(slider){
  var player=slider.closest('.custom-player');
  if(_cpPlayer!==player)return;
  var v=parseFloat(slider.value);
  var ctrl=slider.dataset.ctrl;
  var now=_cpCtx?_cpCtx.currentTime:0;
  if(ctrl==='vol'){
    if(_cpGain)_cpGain.gain.setTargetAtTime(v/100,now,0.01);
    else if(_cpAudio&&_cpAudio.volume!==undefined)_cpAudio.volume=v/100;
  }
  if(ctrl==='low'&&_cpLow)_cpLow.gain.setTargetAtTime(v,now,0.01);
  if(ctrl==='mid'&&_cpMid)_cpMid.gain.setTargetAtTime(v,now,0.01);
  if(ctrl==='hi'&&_cpHi)_cpHi.gain.setTargetAtTime(v,now,0.01);
}

function cpToggle(btn){
  var player=btn.closest('.custom-player');
  var src=player.dataset.src;
  if(!src)return;
  // switching to a different player
  if(_cpPlayer&&_cpPlayer!==player){
    cpTeardown();
    _cpPlayer.querySelector('.cp-btn').innerHTML='&#9654;';
    var oc=_cpPlayer.querySelector('.cp-canvas');
    if(oc&&oc._bars)cpColorWaveform(oc,0);
    var ot=_cpPlayer.querySelector('.cp-time');
    if(ot)ot.textContent='0:00';
    _cpPlayer=null;
    _cpAudio=null;
  }
  _cpPlayer=player;
  _cpAudio=true; // flag that player is active
  // Draw waveform
  var canvas=player.querySelector('.cp-canvas');
  if(canvas&&!canvas._bars)cpDrawWaveform(canvas,src);
  // Reset sliders if fresh
  if(!_cpCtx){
    player.querySelectorAll('.cp-slider').forEach(function(s){s.value=s.dataset.ctrl==='vol'?100:0;});
  }
  if(_cpPlaying){
    // pause
    _cpOffset=cpCurrentTime();
    cpStop();
    btn.innerHTML='&#9654;';
    return;
  }
  // need to decode?
  if(!_cpBuffer){
    btn.innerHTML='…';
    _cpCtx=new(window.AudioContext||window.webkitAudioContext)();
    cpBuildChain();
    // Handle both data URLs and blob URLs
    function doDecode(arrayBuf){
      // decodeAudioData returns a promise in modern browsers
      var p=_cpCtx.decodeAudioData(arrayBuf,function(decoded){
        _cpBuffer=decoded;_cpDuration=decoded.duration;
        btn.innerHTML='&#9646;&#9646;';cpPlayFrom(_cpOffset);
      },function(e){
        console.error('decodeAudioData error:',e);
        // Fallback: use HTML Audio element routed through context
        cpFallbackPlay(src,btn);
      });
      if(p&&p.catch)p.catch(function(e){
        console.error('decodeAudioData promise error:',e);
        cpFallbackPlay(src,btn);
      });
    }
    if(src.startsWith('data:')){
      var comma=src.indexOf(',');
      var b64=src.slice(comma+1);
      try{
        var bin=atob(b64);
        var ab=new Uint8Array(bin.length);
        for(var i=0;i<bin.length;i++)ab[i]=bin.charCodeAt(i);
        doDecode(ab.buffer);
      }catch(e){console.error('atob error:',e);cpFallbackPlay(src,btn);}
    } else {
      fetch(src).then(function(r){return r.arrayBuffer();}).then(doDecode)
        .catch(function(e){console.error('Fetch error:',e);cpFallbackPlay(src,btn);});
    }
    return;
  }
  btn.innerHTML='&#9646;&#9646;';
  if(_cpCtx.state==='suspended')_cpCtx.resume();
  cpPlayFrom(_cpOffset);
}

function cpAnimate(player,audio){/* replaced by cpAnimate2 */}

function cpFallbackPlay(src,btn){
  // Fallback: route HTML Audio element through Web Audio for EQ
  console.log('Using MediaElement fallback for EQ');
  var audio=new Audio(src);
  audio.crossOrigin='anonymous';
  _cpAudio=audio;
  // Re-use existing context and chain
  try{
    var source=_cpCtx.createMediaElementSource(audio);
    source.connect(_cpLow);
    // Store reference so seek works
    _cpBuffer='fallback';
    _cpDuration=0;
    audio.addEventListener('loadedmetadata',function(){_cpDuration=audio.duration;});
    audio.addEventListener('timeupdate',function(){
      if(!_cpPlayer)return;
      var progress=audio.duration?audio.currentTime/audio.duration:0;
      var canvas=_cpPlayer.querySelector('.cp-canvas');
      if(canvas&&canvas._bars)cpColorWaveform(canvas,progress);
      var ph=_cpPlayer.querySelector('.cp-playhead');
      if(ph)ph.style.left=(progress*100)+'%';
      var t=_cpPlayer.querySelector('.cp-time');
      var s=Math.floor(audio.currentTime);
      if(t)t.textContent=Math.floor(s/60)+':'+(s%60<10?'0':'')+s%60;
    });
    audio.addEventListener('ended',function(){
      _cpPlaying=false;
      if(_cpPlayer){_cpPlayer.querySelector('.cp-btn').innerHTML='&#9654;';}
    });
    audio.play().then(function(){
      _cpPlaying=true;btn.innerHTML='&#9646;&#9646;';
    }).catch(function(e){console.error('Fallback play error:',e);btn.innerHTML='&#9654;';});
  }catch(e){
    console.error('MediaElement source error:',e);
    // Last resort: plain audio no EQ
    audio.play();btn.innerHTML='&#9646;&#9646;';
    _cpPlaying=true;
  }
}


function cpSeek(e,track){
  if(!_cpBuffer)return;
  var rect=track.getBoundingClientRect();
  var frac=(e.clientX-rect.left)/rect.width;
  if(_cpBuffer==='fallback'&&_cpAudio&&_cpAudio.duration){
    _cpAudio.currentTime=frac*_cpAudio.duration;return;
  }
  if(!_cpDuration)return;
  var t=frac*_cpDuration;
  _cpOffset=Math.max(0,Math.min(t,_cpDuration));
  if(_cpPlaying)cpPlayFrom(_cpOffset);
  else{
    var canvas=track.closest('.custom-player').querySelector('.cp-canvas');
    if(canvas&&canvas._bars)cpColorWaveform(canvas,_cpOffset/_cpDuration);
    var ph=track.querySelector('.cp-playhead');
    if(ph)ph.style.left=(_cpOffset/_cpDuration*100)+'%';
  }
}

function getSortedMarks(){
  var fl=filt==='all'?marks.slice():marks.filter(function(m){return m.category===filt;});
  if(currentSort==='date'){
    fl.sort(function(a,b){return new Date(b.date)-new Date(a.date);});
  } else if(currentSort==='category'){
    fl.sort(function(a,b){return (a.category||'').localeCompare(b.category||'');});
  } else if(currentSort==='intensity'){
    fl.sort(function(a,b){return b.intensity-a.intensity;});
  } else if(currentSort==='proximity'&&userLat!==null){
    fl.sort(function(a,b){
      var alat=parseFloat(a.lat||(a.position&&a.position[0]));
      var alng=parseFloat(a.lng||(a.position&&a.position[1]));
      var blat=parseFloat(b.lat||(b.position&&b.position[0]));
      var blng=parseFloat(b.lng||(b.position&&b.position[1]));
      var da=Math.pow(alat-userLat,2)+Math.pow(alng-userLng,2);
      var db=Math.pow(blat-userLat,2)+Math.pow(blng-userLng,2);
      return da-db;
    });
  }
  return fl;
}

// ── Drag select on map ──
var dragSelectMode=false;
var dragStart=null,dragRect=null;

function toggleDragSelect(){
  dragSelectMode=!dragSelectMode;
  var btn=document.getElementById('drag-btn');
  btn.classList.toggle('on',dragSelectMode);
  btn.textContent=dragSelectMode?'✕ Cancel':'⬚ Select';
  map.dragging[dragSelectMode?'disable':'enable']();
  document.getElementById('map').style.cursor=dragSelectMode?'crosshair':'';
}

var mapEl=document.getElementById('map');

mapEl.addEventListener('mousedown',function(e){
  if(!dragSelectMode||e.button!==0)return;
  e.preventDefault();
  dragStart={x:e.offsetX,y:e.offsetY};
  var box=document.getElementById('drag-box');
  box.style.left=dragStart.x+'px';box.style.top=dragStart.y+'px';
  box.style.width='0px';box.style.height='0px';box.style.display='block';
});

mapEl.addEventListener('mousemove',function(e){
  if(!dragSelectMode||!dragStart)return;
  var box=document.getElementById('drag-box');
  var x=Math.min(e.offsetX,dragStart.x);
  var y=Math.min(e.offsetY,dragStart.y);
  var w=Math.abs(e.offsetX-dragStart.x);
  var h=Math.abs(e.offsetY-dragStart.y);
  box.style.left=x+'px';box.style.top=y+'px';
  box.style.width=w+'px';box.style.height=h+'px';
  dragRect={x:x,y:y,w:w,h:h};
});

var _suppressNextClick=false;
mapEl.addEventListener('mouseup',function(e){
  if(!dragSelectMode||!dragRect)return;
  _suppressNextClick=true;
  document.getElementById('drag-box').style.display='none';
  // Find marks inside the drag rectangle
  var mapRect=mapEl.getBoundingClientRect();
  marks.forEach(function(m){
    var lat=parseFloat(m.lat||(m.position&&m.position[0]));
    var lng=parseFloat(m.lng||(m.position&&m.position[1]));
    if(isNaN(lat)||isNaN(lng))return;
    var pt=map.latLngToContainerPoint([lat,lng]);
    if(pt.x>=dragRect.x&&pt.x<=dragRect.x+dragRect.w&&pt.y>=dragRect.y&&pt.y<=dragRect.y+dragRect.h){
      if(selectedIds.indexOf(m.id)===-1)selectedIds.push(m.id);
    }
  });
  dragStart=null;dragRect=null;
  updateSelCount();
  updateSelBadge();
  // turn off drag mode
  toggleDragSelect();
});

// touch support for mobile drag
mapEl.addEventListener('touchstart',function(e){
  if(!dragSelectMode)return;
  e.preventDefault();
  var t=e.touches[0];
  var r=mapEl.getBoundingClientRect();
  dragStart={x:t.clientX-r.left,y:t.clientY-r.top};
  var box=document.getElementById('drag-box');
  box.style.left=dragStart.x+'px';box.style.top=dragStart.y+'px';
  box.style.width='0px';box.style.height='0px';box.style.display='block';
},{passive:false});

mapEl.addEventListener('touchmove',function(e){
  if(!dragSelectMode||!dragStart)return;
  e.preventDefault();
  var t=e.touches[0];
  var r=mapEl.getBoundingClientRect();
  var ox=t.clientX-r.left,oy=t.clientY-r.top;
  var x=Math.min(ox,dragStart.x),y=Math.min(oy,dragStart.y);
  var w=Math.abs(ox-dragStart.x),h=Math.abs(oy-dragStart.y);
  var box=document.getElementById('drag-box');
  box.style.left=x+'px';box.style.top=y+'px';box.style.width=w+'px';box.style.height=h+'px';
  dragRect={x:x,y:y,w:w,h:h};
},{passive:false});

mapEl.addEventListener('touchend',function(e){
  if(!dragSelectMode||!dragRect)return;
  _suppressNextClick=true;
  document.getElementById('drag-box').style.display='none';
  marks.forEach(function(m){
    var lat=parseFloat(m.lat||(m.position&&m.position[0]));
    var lng=parseFloat(m.lng||(m.position&&m.position[1]));
    if(isNaN(lat)||isNaN(lng))return;
    var pt=map.latLngToContainerPoint([lat,lng]);
    if(pt.x>=dragRect.x&&pt.x<=dragRect.x+dragRect.w&&pt.y>=dragRect.y&&pt.y<=dragRect.y+dragRect.h){
      if(selectedIds.indexOf(m.id)===-1)selectedIds.push(m.id);
    }
  });
  dragStart=null;dragRect=null;
  updateSelCount();updateSelBadge();
  toggleDragSelect();
});

// ── Security: sanitize + rate limit ──
function sanitize(str){
  if(!str)return '';
  return str.replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').slice(0,500);
}

function checkRateLimit(){
  var key='sm_submissions';
  var now=Date.now();
  var window=60*60*1000; // 1 hour
  var limit=10;
  var stored;
  try{stored=JSON.parse(localStorage.getItem(key)||'[]');}catch(e){stored=[];}
  // Filter to only submissions within the last hour
  stored=stored.filter(function(t){return now-t<window;});
  if(stored.length>=limit){
    var oldest=stored[0];
    var waitMin=Math.ceil((window-(now-oldest))/60000);
    alert('You\'ve placed '+limit+' soundmarks in the last hour. Please wait '+waitMin+' more minute'+(waitMin===1?'':'s')+'.');
    return false;
  }
  stored.push(now);
  try{localStorage.setItem(key,JSON.stringify(stored));}catch(e){}
  return true;
}
function saveM(){
  var t=document.getElementById('ft').value.trim();if(!t||!plng)return;
  if(!checkRateLimit())return;
  var id='sm-'+Date.now()+'-'+Math.random().toString(36).slice(2);
  var m={id:id,
    title:sanitize(t),
    description:sanitize(document.getElementById('fd').value.trim()),
    category:scat,
    intensity:Math.max(1,Math.min(5,+document.getElementById('fi').value)),
    contributor:sanitize(document.getElementById('fn').value.trim()),
    lat:plng.lat,lng:plng.lng,place:pplace,date:new Date().toISOString(),
    audio:null,waveenv:null};

  // Show saving state
  var btn=document.getElementById('bs');
  btn.textContent='Saving…';btn.disabled=true;

  function doSave(mark){
    marksRef.child(mark.id).set(mark)
      .then(function(){cm();setTimeout(function(){if(lms[mark.id])lms[mark.id].openPopup();},600);})
      .catch(function(e){alert('Could not save: '+e.message);btn.textContent='Place Soundmark';btn.disabled=false;});
  }

  function withEnvelope(dataUrl, cb){
    extractEnvelope(dataUrl, function(env){ m.waveenv=env; cb(); });
  }

  if(pendingAudio && (pendingAudio.blob || pendingAudio.dataUrl)){
    // Upload audio blob to Firebase Storage
    var blob = pendingAudio.blob;
    if(blob && blob.size > 20*1024*1024){alert('Recording is too large (max 20MB — about 6 minutes). Please trim or re-record.');btn.textContent='Place Soundmark';btn.disabled=false;return;}
    if(!blob && pendingAudio.dataUrl && !pendingAudio.isBlobUrl){
      // Legacy: convert dataUrl to blob
      var arr=pendingAudio.dataUrl.split(','), mime=arr[0].match(/:(.*?);/)[1];
      var bstr=atob(arr[1]), n=bstr.length, u8=new Uint8Array(n);
      for(var i=0;i<n;i++)u8[i]=bstr.charCodeAt(i);
      blob=new Blob([u8],{type:mime});
    }
    var ext=pendingAudio.name?pendingAudio.name.split('.').pop():'webm';
    var storageRef=storage.ref('audio/'+id+'.'+ext);
    btn.textContent='Uploading…';
    storageRef.put(blob).then(function(snap){
      return snap.ref.getDownloadURL();
    }).then(function(url){
      m.audio=url;
      // For waveform extraction use blob URL (works for both blob and data URLs)
      var envUrl=pendingAudio.isBlobUrl ? pendingAudio.dataUrl : URL.createObjectURL(blob);
      withEnvelope(envUrl, function(){
        doSave(m);
      });
    }).catch(function(e){
      console.error('Storage upload failed:',e);
      alert('Audio upload failed — soundmark will be saved without audio.');
      doSave(m);
    });
  } else {
    doSave(m);
  }
}

function extractEnvelope(src,cb){
  try{
    var actx=new(window.AudioContext||window.webkitAudioContext)();
    function decode(arrayBuf){
      actx.decodeAudioData(arrayBuf,function(decoded){
        var raw=decoded.getChannelData(0);
        var samples=80;
        var block=Math.floor(raw.length/samples);
        var env=[];
        for(var i=0;i<samples;i++){
          var sum=0;
          for(var j=0;j<block;j++)sum+=Math.abs(raw[i*block+j]);
          env.push(sum/block);
        }
        var mx=Math.max.apply(null,env)||1;
        env=env.map(function(v){return Math.round((v/mx)*100)/100;});
        actx.close();cb(env);
      },function(){actx.close();cb(null);});
    }
    if(src.startsWith('blob:')||src.startsWith('http')){
      fetch(src).then(function(r){return r.arrayBuffer();}).then(decode)
        .catch(function(){cb(null);});
    } else {
      // legacy data URL
      var b64=src.split(',')[1];
      var bin=atob(b64);
      var buf=new Uint8Array(bin.length);
      for(var i=0;i<bin.length;i++)buf[i]=bin.charCodeAt(i);
      decode(buf.buffer);
    }
  }catch(e){cb(null);}
}


// ── Audio Migration: base64 → Firebase Storage ──
async function migrateAudio(){
  var toMigrate=marks.filter(function(m){return m.audio&&m.audio.startsWith('data:');});
  if(toMigrate.length===0){
    alert('No base64 audio found — all marks already use Storage URLs.');return;
  }
  var overlay=document.getElementById('migrate-overlay');
  var statusEl=document.getElementById('migrate-status');
  var barEl=document.getElementById('migrate-bar');
  var closeBtn=document.getElementById('migrate-close');
  overlay.style.display='flex';
  statusEl.textContent='Found '+toMigrate.length+' mark(s) to migrate…';
  barEl.style.width='0%';
  closeBtn.style.display='none';

  var done=0,failed=0;

  for(var i=0;i<toMigrate.length;i++){
    var m=toMigrate[i];
    statusEl.textContent='['+( i+1)+'/'+toMigrate.length+'] Uploading: '+m.title+'…';
    try{
      // Parse data URL
      var dataUrl=m.audio;
      var comma=dataUrl.indexOf(',');
      var mime=dataUrl.slice(5,dataUrl.indexOf(';'));
      var ext=mime.split('/')[1]||'webm';
      if(ext==='x-m4a'||ext==='mp4a-latm')ext='m4a';
      if(ext==='mpeg')ext='mp3';

      var b64=dataUrl.slice(comma+1);
      var bin=atob(b64);
      var u8=new Uint8Array(bin.length);
      for(var j=0;j<bin.length;j++)u8[j]=bin.charCodeAt(j);
      var blob=new Blob([u8],{type:mime});

      // Upload to Storage
      var storageRef=storage.ref('audio/'+m.id+'.'+ext);
      var snap=await storageRef.put(blob);
      var url=await snap.ref.getDownloadURL();

      // Update database — replace base64 with URL, keep everything else
      await marksRef.child(m.id).update({audio:url});
      done++;
      statusEl.textContent='['+( i+1)+'/'+toMigrate.length+'] ✓ '+m.title;
    } catch(e){
      console.error('Migration failed for',m.id,e);
      failed++;
      statusEl.textContent='['+( i+1)+'/'+toMigrate.length+'] ✗ Failed: '+m.title+' — '+e.message;
    }
    barEl.style.width=(((i+1)/toMigrate.length)*100)+'%';
    // Small pause to avoid hammering Storage
    await new Promise(function(r){setTimeout(r,200);});
  }

  statusEl.textContent='Done! '+done+' migrated'+(failed?' | '+failed+' failed':'')+'. Reload the page to confirm.';
  closeBtn.style.display='inline-block';
}

function dm(id){
  // Also delete audio from Storage if it's a Storage URL
  var mark=marks.find(function(m){return m.id===id;});
  if(mark&&mark.audio&&mark.audio.includes('firebasestorage')){
    try{storage.refFromURL(mark.audio).delete().catch(function(){});}catch(e){}
  }
  marksRef.child(id).remove();
  marks=marks.filter(function(m){return m.id!==id;});
  if(lms[id]){map.removeLayer(lms[id]);delete lms[id];}
  map.closePopup();
  rl();
}
