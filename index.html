<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>soundmarks</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Overpass+Mono:wght@300;400&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#111110;--surf:#1c1c1a;--rule:#333330;--rule2:#272724;
  --text:#f0ece4;--dim:#a8a49c;--faint:#5a5a54;
  --serif:'Cormorant',Georgia,serif;
  --serifg:'Cormorant Garamond',Georgia,serif;
  --mono:'Overpass Mono',monospace;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--mono);overflow:hidden;}
#shell{display:grid;grid-template-rows:auto auto 1fr;height:100vh;}

#hd{display:grid;grid-template-columns:1fr auto;align-items:end;padding:1.8rem 2rem 1.1rem;border-bottom:1px solid var(--rule);gap:2rem;}
#wordmark{font-family:var(--serif);font-weight:600;font-size:clamp(2.4rem,5vw,4rem);letter-spacing:0.18em;line-height:0.9;color:var(--text);text-transform:uppercase;font-style:normal;}
#mark-count{font-family:var(--serif);font-size:1.05rem;font-weight:300;color:var(--dim);letter-spacing:0.05em;}
#mark-count b{color:var(--text);font-weight:400;}
.nav-tabs{display:flex;}
.ntab{font-family:var(--mono);font-size:0.58rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--dim);background:none;border:none;cursor:pointer;padding:0.2rem 0.6rem 0.2rem 0;border-bottom:1px solid transparent;transition:all 0.12s;font-weight:300;}
.ntab:first-child{padding-left:0;}
.ntab.on{color:var(--text);border-bottom-color:var(--text);}
.ntab:hover{color:var(--text);}

#fbar{display:flex;align-items:center;padding:0.55rem 2rem;border-bottom:1px solid var(--rule2);overflow-x:auto;gap:0;}
#fbar::-webkit-scrollbar{display:none;}
.fl{font-family:var(--mono);font-size:0.55rem;color:var(--faint);margin-right:1.2rem;letter-spacing:0.14em;text-transform:uppercase;white-space:nowrap;flex-shrink:0;}
.fc{font-family:var(--mono);font-size:0.58rem;color:var(--dim);background:none;border:none;cursor:pointer;padding:0.1rem 0.8rem 0.1rem 0;white-space:nowrap;transition:color 0.1s;border-bottom:1px solid transparent;letter-spacing:0.1em;text-transform:uppercase;font-weight:300;}
.fc.on{color:var(--text);border-bottom-color:var(--text);}
.fc:hover{color:var(--text);}

#stage{position:relative;overflow:hidden;}
#map{width:100%;height:100%;}
.leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) saturate(0.25) brightness(0.85) contrast(1.1);}
.leaflet-control-zoom{border:1px solid var(--rule)!important;border-radius:0!important;box-shadow:none!important;}
.leaflet-control-zoom a{background:var(--surf)!important;color:var(--text)!important;border-color:var(--rule)!important;border-radius:0!important;font-family:var(--mono)!important;font-weight:300!important;width:26px!important;height:26px!important;line-height:24px!important;font-size:0.9rem!important;}
.leaflet-control-zoom a:hover{color:var(--bg)!important;background:var(--text)!important;}
.leaflet-control-attribution{background:rgba(17,17,16,0.92)!important;color:var(--faint)!important;font-family:var(--mono)!important;font-size:0.52rem!important;}
.leaflet-control-attribution a{color:var(--faint)!important;}
.leaflet-popup-content-wrapper{background:var(--surf);border:1px solid var(--rule);border-radius:0;box-shadow:4px 4px 0 rgba(0,0,0,0.6);padding:0;font-family:var(--mono);}
.leaflet-popup-content{margin:0;width:auto!important;}
.leaflet-popup-tip-container{display:none;}
.leaflet-popup-close-button{color:var(--dim)!important;font-size:1rem!important;top:10px!important;right:12px!important;}
.leaflet-popup-close-button:hover{color:var(--text)!important;}

/* ── Animated radiating marker ── */
.sm-marker{position:relative;display:flex;align-items:center;justify-content:center;}
.sm-dot{border-radius:50%;position:relative;z-index:2;flex-shrink:0;}
.sm-ring{position:absolute;border-radius:50%;border:1px solid currentColor;top:50%;left:50%;transform:translate(-50%,-50%);animation:ripple 2.4s ease-out infinite;opacity:0;}
.sm-ring:nth-child(2){animation-delay:0s;}
.sm-ring:nth-child(3){animation-delay:0.8s;}
.sm-ring:nth-child(4){animation-delay:1.6s;}
@keyframes ripple{
  0%{width:var(--dot-size);height:var(--dot-size);opacity:0.7;}
  100%{width:calc(var(--dot-size)*4.5);height:calc(var(--dot-size)*4.5);opacity:0;}
}

#hint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:var(--surf);border:1px solid var(--rule);padding:0.35rem 1.1rem;font-family:var(--mono);font-size:0.56rem;color:var(--dim);z-index:700;pointer-events:none;letter-spacing:0.12em;text-transform:uppercase;white-space:nowrap;}

/* search with autocomplete */
#sbox{position:absolute;top:12px;right:12px;z-index:700;display:flex;flex-direction:column;width:260px;}
#sbox-row{display:flex;border:1px solid var(--rule);background:var(--surf);}
#si{padding:0.4rem 0.7rem;font-size:0.6rem;font-family:var(--mono);background:none;border:none;color:var(--text);outline:none;flex:1;letter-spacing:0.06em;}
#si::placeholder{color:var(--faint);}
#sb{padding:0.4rem 0.7rem;background:var(--rule);color:var(--dim);border:none;font-family:var(--mono);font-size:0.6rem;cursor:pointer;letter-spacing:0.1em;text-transform:uppercase;border-left:1px solid var(--rule2);}
#sb:hover{color:var(--text);}
#sugs{background:var(--surf);border:1px solid var(--rule);border-top:none;display:none;flex-direction:column;max-height:220px;overflow-y:auto;}
#sugs.open{display:flex;}
.sug{padding:0.5rem 0.7rem;font-family:var(--mono);font-size:0.58rem;color:var(--dim);cursor:pointer;letter-spacing:0.03em;border-bottom:1px solid var(--rule2);line-height:1.4;}
.sug:last-child{border-bottom:none;}
.sug:hover{background:var(--rule2);color:var(--text);}
.sug-main{color:var(--text);}
.sug-sub{font-size:0.52rem;color:var(--faint);margin-top:0.1rem;}

#listv{display:none;position:absolute;inset:0;background:var(--bg);overflow-y:auto;z-index:600;}
#listv.on{display:block;}
#listv-inner{padding:2rem;max-width:1100px;}
.l-empty{padding:3rem 0;color:var(--dim);font-size:0.75rem;font-family:var(--serifg);}
.l-head{display:grid;grid-template-columns:2.4fr 1fr 0.7fr 0.8fr 0.5fr auto;gap:1.2rem;padding:0 0 0.6rem;font-family:var(--mono);font-size:0.52rem;color:var(--faint);letter-spacing:0.16em;text-transform:uppercase;border-bottom:1px solid var(--text);}
.l-row{display:grid;grid-template-columns:2.4fr 1fr 0.7fr 0.8fr 0.5fr auto;gap:1.2rem;align-items:center;padding:0.9rem 0;border-bottom:1px solid var(--rule2);}
.l-title{font-family:var(--serif);font-size:1.2rem;font-weight:300;color:var(--text);line-height:1.2;}
.l-sub{font-family:var(--serifg);font-size:0.7rem;color:var(--dim);margin-top:0.15rem;}
.l-loc{color:var(--dim);font-size:0.6rem;font-family:var(--mono);letter-spacing:0.04em;}
.l-int{color:var(--dim);font-size:0.6rem;font-family:var(--mono);}
.l-audio-btn{background:none;border:1px solid var(--rule);color:var(--dim);cursor:pointer;font-size:0.55rem;font-family:var(--mono);padding:0.18rem 0.45rem;letter-spacing:0.08em;text-transform:uppercase;}
.l-audio-btn:hover{border-color:var(--text);color:var(--text);}
.l-del{background:none;border:none;color:var(--faint);cursor:pointer;font-size:0.8rem;font-family:var(--mono);line-height:1;padding:0 0.2rem;}
.l-del:hover{color:#a03030;}

#mo{display:none;position:fixed;inset:0;z-index:2000;background:rgba(6,6,5,0.82);backdrop-filter:blur(5px);align-items:center;justify-content:center;padding:1rem;}
#mo.on{display:flex;}
#md{background:var(--surf);border:1px solid var(--rule);width:100%;max-width:500px;max-height:92vh;overflow-y:auto;box-shadow:8px 8px 0 rgba(0,0,0,0.5);animation:pop 0.15s ease;}
@keyframes pop{from{transform:translate(4px,8px);opacity:0}to{transform:translate(0,0);opacity:1}}
.md-head{padding:1.4rem 1.6rem 1.1rem;border-bottom:1px solid var(--rule);display:flex;align-items:flex-start;justify-content:space-between;position:sticky;top:0;background:var(--surf);z-index:1;}
.md-label{font-family:var(--mono);font-size:0.52rem;color:var(--dim);letter-spacing:0.18em;text-transform:uppercase;margin-bottom:0.4rem;font-weight:300;}
.md-coords{font-family:var(--serif);font-weight:300;font-size:1.6rem;color:var(--text);line-height:1;letter-spacing:0.04em;}
.md-place{font-family:var(--serifg);font-size:0.78rem;color:var(--dim);margin-top:0.3rem;}
.md-x{background:none;border:none;font-size:1.1rem;color:var(--faint);cursor:pointer;padding:0;line-height:1;font-family:var(--mono);}
.md-x:hover{color:var(--text);}
.md-body{padding:1.2rem 1.6rem;}
.md-field{margin-bottom:1rem;}
.md-field label{display:block;font-family:var(--mono);font-size:0.52rem;color:var(--dim);letter-spacing:0.16em;text-transform:uppercase;margin-bottom:0.4rem;font-weight:300;}
.md-field input[type=text],.md-field textarea{width:100%;background:none;border:none;border-bottom:1px solid var(--rule);padding:0.35rem 0;font-size:1rem;font-family:var(--serif);font-weight:300;color:var(--text);outline:none;resize:none;transition:border-color 0.15s;letter-spacing:0.02em;}
.md-field input[type=text]:focus,.md-field textarea:focus{border-bottom-color:var(--text);}
.md-field input[type=text]::placeholder,.md-field textarea::placeholder{color:var(--faint);}
.md-field textarea{height:60px;}
.md-field input[type=range]{-webkit-appearance:none;width:100%;height:1px;background:var(--rule);margin:0.65rem 0 0.22rem;cursor:pointer;}
.md-field input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:9px;height:9px;background:var(--text);border-radius:50%;}
.int-row{display:flex;justify-content:space-between;font-family:var(--mono);font-size:0.52rem;color:var(--faint);letter-spacing:0.08em;}
.int-val{font-family:var(--serifg);font-size:0.85rem;color:var(--dim);}
.cat-row{display:flex;flex-wrap:wrap;gap:0.3rem;margin-top:0.3rem;}
.cb{font-family:var(--mono);font-size:0.55rem;padding:0.22rem 0.6rem;border:1px solid var(--rule);background:none;color:var(--dim);cursor:pointer;letter-spacing:0.1em;text-transform:uppercase;transition:all 0.1s;}
.cb.on{background:var(--text);color:var(--bg);border-color:var(--text);}
.cb:hover:not(.on){border-color:var(--dim);color:var(--text);}
.audio-zone{border:1px dashed var(--rule);padding:0.9rem 1rem;text-align:center;cursor:pointer;transition:border-color 0.15s;position:relative;}
.audio-zone:hover,.audio-zone.drag{border-color:var(--dim);}
.audio-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.audio-zone-lbl{font-family:var(--serifg);font-size:0.82rem;color:var(--faint);pointer-events:none;}
.audio-zone-lbl b{color:var(--dim);font-weight:400;}
.audio-preview{margin-top:0.5rem;display:flex;align-items:center;gap:0.6rem;}
.audio-name{font-family:var(--mono);font-size:0.6rem;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px;letter-spacing:0.04em;}
.audio-clear{background:none;border:none;color:var(--faint);cursor:pointer;font-size:0.75rem;font-family:var(--mono);}
.audio-clear:hover{color:#a03030;}
.md-foot{display:flex;gap:0.5rem;padding:0 1.6rem 1.4rem;}
.btn-c{padding:0.55rem 1.2rem;background:none;border:1px solid var(--rule);color:var(--dim);font-family:var(--mono);font-size:0.58rem;cursor:pointer;letter-spacing:0.12em;text-transform:uppercase;transition:all 0.1s;}
.btn-c:hover{border-color:var(--dim);color:var(--text);}
.btn-s{flex:1;padding:0.55rem 1.2rem;background:var(--text);border:1px solid var(--text);color:var(--bg);font-family:var(--mono);font-size:0.58rem;cursor:pointer;letter-spacing:0.12em;text-transform:uppercase;transition:opacity 0.1s;}
.btn-s:hover{opacity:0.82;}
.btn-s:disabled{background:var(--rule);border-color:var(--rule);color:var(--faint);cursor:not-allowed;opacity:1;}

.pu{padding:1.1rem 1.2rem 1rem;min-width:220px;max-width:290px;}
.pu-cat{font-family:var(--mono);font-size:0.52rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--dim);margin-bottom:0.4rem;}
.pu-title{font-family:var(--serif);font-weight:300;font-size:1.3rem;color:var(--text);margin-bottom:0.25rem;line-height:1.2;letter-spacing:0.02em;}
.pu-loc{font-family:var(--serifg);font-size:0.72rem;color:var(--dim);margin-bottom:0.55rem;}
.pu-desc{font-family:var(--serifg);font-size:0.76rem;color:var(--dim);line-height:1.6;margin-bottom:0.55rem;}
.pu-img{width:100%;max-height:160px;overflow:hidden;margin-bottom:0;border-bottom:1px solid var(--rule);}
.pu-img img{width:100%;height:160px;object-fit:cover;display:block;}
.pu-audio{margin-bottom:0.55rem;padding:0.7rem 0 0;}
.pu-player{display:flex;flex-direction:column;gap:0.4rem;}
.pu-player-row{display:flex;align-items:center;gap:0.55rem;}
.pu-play{background:var(--text);color:var(--surf);border:none;cursor:pointer;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:0.75rem;flex-shrink:0;}
.pu-play:hover{opacity:0.75;}
.pu-scrub{flex:1;-webkit-appearance:none;appearance:none;height:2px;background:var(--rule);cursor:pointer;outline:none;}
.pu-scrub::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;background:var(--text);border-radius:50%;}
.pu-time{font-family:var(--mono);font-size:0.52rem;color:var(--faint);white-space:nowrap;min-width:60px;text-align:right;letter-spacing:0.04em;}
.pu-meta{display:flex;gap:0.6rem;font-family:var(--mono);font-size:0.55rem;color:var(--faint);flex-wrap:wrap;padding-top:0.5rem;border-top:1px solid var(--rule);margin-bottom:0.6rem;letter-spacing:0.04em;}
.pu-del{width:100%;background:none;border:1px solid var(--rule);color:var(--faint);font-family:var(--mono);font-size:0.55rem;cursor:pointer;padding:0.3rem;letter-spacing:0.1em;text-transform:uppercase;}
.pu-del:hover{border-color:#a03030;color:#a03030;}

::-webkit-scrollbar{width:2px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--rule);}
</style>
</head>
<body>
<div id="shell">
  <div id="hd">
    <div id="hd-left">
      <div id="wordmark">Soundmarks</div>
    </div>
    <div id="hd-right">
      <div id="mark-count"><b id="cnt">0</b> marks placed</div>
      <nav class="nav-tabs">
        <button class="ntab on" id="t-map" onclick="sv('map')">Map,</button>
        <button class="ntab" id="t-list" onclick="sv('list')">Index</button>
      </nav>
    </div>
  </div>
  <div id="fbar">
    <span class="fl">Filter —</span>
    <button class="fc on" data-c="all" onclick="sf('all')">All</button>
  </div>
  <div id="stage">
    <div id="map"></div>
    <div id="hint">Click anywhere to mark a sound</div>
    <div id="sbox">
      <div id="sbox-row">
        <input id="si" placeholder="Search a place…" autocomplete="off"/>
        <button id="sb" onclick="sp()">Go</button>
      </div>
      <div id="sugs"></div>
    </div>
    <div id="listv">
      <div id="listv-inner">
        <div class="l-head"><span>Title</span><span>Location</span><span>Category</span><span>Intensity</span><span>Audio</span><span></span></div>
        <div id="l-rows"></div>
        <div class="l-empty" id="l-empty" style="display:none">No soundmarks yet. Switch to map view to place some.</div>
      </div>
    </div>
  </div>
</div>

<div id="mo">
  <div id="md">
    <div class="md-head">
      <div>
        <div class="md-label">New Soundmark</div>
        <div class="md-coords" id="mc"></div>
        <div class="md-place" id="mpl"></div>
      </div>
      <button class="md-x" onclick="cm()">×</button>
    </div>
    <div class="md-body">
      <div class="md-field"><label>Category</label><div class="cat-row" id="cg"></div></div>
      <div class="md-field"><label>Title *</label><input type="text" id="ft" placeholder="Name this sound…"/></div>
      <div class="md-field"><label>Description</label><textarea id="fd" placeholder="What do you hear?"></textarea></div>
      <div class="md-field">
        <label>Intensity — <span class="int-val" id="il">Moderate</span></label>
        <input type="range" id="fi" min="0" max="4" value="2"/>
        <div class="int-row"><span>Very Quiet</span><span>Very Loud</span></div>
      </div>
      <div class="md-field">
        <label>Sound File <span style="color:var(--faint);text-transform:none;letter-spacing:0;">(optional)</span></label>
        <div class="audio-zone" id="az" ondragover="event.preventDefault();this.classList.add('drag')" ondragleave="this.classList.remove('drag')" ondrop="handleDrop(event)">
          <input type="file" accept="audio/*" id="af" onchange="handleFile(this.files[0])"/>
          <div class="audio-zone-lbl" id="azl">Drop file or <b>browse</b> — mp3, wav, ogg, m4a</div>
        </div>
        <div class="audio-preview" id="ap" style="display:none">
          <span class="audio-name" id="an"></span>
          <button class="audio-clear" onclick="clearAudio()">×</button>
        </div>
      </div>
      <div class="md-field">
        <label>Image <span style="color:var(--faint);text-transform:none;letter-spacing:0;">(optional)</span></label>
        <div class="audio-zone" id="iz" ondragover="event.preventDefault();this.classList.add('drag')" ondragleave="this.classList.remove('drag')" ondrop="handleImgDrop(event)">
          <input type="file" accept="image/*" id="imgf" onchange="handleImg(this.files[0])"/>
          <div class="audio-zone-lbl" id="izl">Drop image or <b>browse</b> — jpg, png, webp</div>
        </div>
        <div class="audio-preview" id="imgp" style="display:none">
          <span class="audio-name" id="imgn"></span>
          <button class="audio-clear" onclick="clearImg()">×</button>
        </div>
      </div>
      <div class="md-field"><label>Your Name</label><input type="text" id="fn" placeholder="Anonymous"/></div>
    </div>
    <div class="md-foot">
      <button class="btn-c" onclick="cm()">Cancel</button>
      <button class="btn-s" id="bs" onclick="saveM()" disabled>Place Soundmark</button>
    </div>
  </div>
</div>

<script>
var CATS=[
  {id:'natural',label:'Natural'},{id:'urban',label:'Urban'},
  {id:'human',label:'Human'},{id:'mechanical',label:'Mechanical'},
  {id:'ambient',label:'Ambient'},{id:'silence',label:'Silence'}
];
var INT=['Very Quiet','Quiet','Moderate','Loud','Very Loud'];
var COL={natural:'#5a9a6a',urban:'#c07040',human:'#4a7abf',mechanical:'#a04a7a',ambient:'#7a60c0',silence:'#6a6a60'};

// ── Firebase init ──
var firebaseConfig={
  apiKey:"AIzaSyB21-WZ4iGXvcbKKokrTTuAEj51F-Ath5Q",
  authDomain:"a-soundmarks.firebaseapp.com",
  databaseURL:"https://a-soundmarks-default-rtdb.firebaseio.com",
  projectId:"a-soundmarks",
  storageBucket:"a-soundmarks.firebasestorage.app",
  messagingSenderId:"1054648701354",
  appId:"1:1054648701354:web:85713f608d0a72cfb51bd3"
};
firebase.initializeApp(firebaseConfig);
var db=firebase.database();
var marksRef=db.ref('marks');

var marks=[];
var filt='all',plng=null,pplace='',scat='natural',lms={};
var pendingAudio=null;
var pendingImg=null;
var activePlayers={};

// ── Live sync from Firebase ──
marksRef.on('value',function(snap){
  marks=[];
  snap.forEach(function(child){marks.push(child.val());});
  rm();
});

var map=L.map('map',{center:[20,0],zoom:2,minZoom:2});
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',maxZoom:19
}).addTo(map);

map.on('click',function(e){
  plng=e.latlng; pplace='';
  document.getElementById('mpl').textContent='Locating…';
  openM(e.latlng);
  rg(e.latlng).then(function(p){pplace=p;document.getElementById('mpl').textContent=p;});
});

// close suggestions when clicking map
map.on('click',function(){closeSugs();});

function rg(ll){
  return fetch('https://nominatim.openstreetmap.org/reverse?lat='+ll.lat+'&lon='+ll.lng+'&format=json')
    .then(function(r){return r.json();})
    .then(function(d){var a=d.address||{};return[a.city||a.town||a.village||a.hamlet||a.county,a.country].filter(Boolean).join(', ')||'';})
    .catch(function(){return '';});
}

// ── Search + Autocomplete ──
var sugTimer=null;
var siEl=document.getElementById('si');
var sugsEl=document.getElementById('sugs');

siEl.addEventListener('input',function(){
  var q=siEl.value.trim();
  clearTimeout(sugTimer);
  if(q.length<2){closeSugs();return;}
  sugTimer=setTimeout(function(){
    fetch('https://nominatim.openstreetmap.org/search?q='+encodeURIComponent(q)+'&format=json&limit=6&addressdetails=1')
      .then(function(r){return r.json();})
      .then(function(results){
        sugsEl.innerHTML='';
        if(!results.length){closeSugs();return;}
        results.forEach(function(r){
          var parts=r.display_name.split(',');
          var main=parts.slice(0,2).join(',').trim();
          var sub=parts.slice(2,4).join(',').trim();
          var div=document.createElement('div');
          div.className='sug';
          div.innerHTML="<div class='sug-main'>"+main+"</div>"+(sub?"<div class='sug-sub'>"+sub+"</div>":"");
          div.addEventListener('click',function(){
            map.setView([+r.lat,+r.lon],12);
            siEl.value=main;
            closeSugs();
          });
          sugsEl.appendChild(div);
        });
        sugsEl.classList.add('open');
      }).catch(function(){});
  },280);
});

siEl.addEventListener('keydown',function(e){
  if(e.key==='Enter'){sp();return;}
  if(e.key==='Escape'){closeSugs();}
});

document.addEventListener('click',function(e){
  if(!document.getElementById('sbox').contains(e.target))closeSugs();
});

function closeSugs(){
  sugsEl.classList.remove('open');
  sugsEl.innerHTML='';
}

function sp(){
  var q=siEl.value.trim();if(!q)return;
  closeSugs();
  fetch('https://nominatim.openstreetmap.org/search?q='+encodeURIComponent(q)+'&format=json&limit=1')
    .then(function(r){return r.json();})
    .then(function(d){if(d.length)map.setView([+d[0].lat,+d[0].lon],12);else alert('Place not found.');})
    .catch(function(){alert('Search failed.');});
}

// audio
var audioCtx=null;
function getAudioCtx(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx;}

function extractWaveform(arrayBuffer,cb){
  try{
    getAudioCtx().decodeAudioData(arrayBuffer,function(buf){
      var raw=buf.getChannelData(0);
      var samples=64;
      var blockSize=Math.floor(raw.length/samples);
      var waveform=[];
      for(var i=0;i<samples;i++){
        var sum=0;
        for(var j=0;j<blockSize;j++) sum+=Math.abs(raw[i*blockSize+j]);
        waveform.push(sum/blockSize);
      }
      // normalize 0-1
      var mx=Math.max.apply(null,waveform)||1;
      waveform=waveform.map(function(v){return v/mx;});
      cb(waveform);
    },function(){cb(null);});
  }catch(e){cb(null);}
}

function handleFile(file){
  if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    var dataUrl=e.target.result;
    pendingAudio={name:file.name,dataUrl:dataUrl,waveform:null};
    document.getElementById('an').textContent=file.name;
    document.getElementById('ap').style.display='flex';
    document.getElementById('azl').style.display='none';
    // decode waveform from arraybuffer
    var r2=new FileReader();
    r2.onload=function(ev){
      extractWaveform(ev.target.result,function(wf){
        if(wf)pendingAudio.waveform=wf;
      });
    };
    r2.readAsArrayBuffer(file);
  };
  reader.readAsDataURL(file);
}
function handleDrop(e){
  e.preventDefault();
  document.getElementById('az').classList.remove('drag');
  var f=e.dataTransfer.files[0];
  if(f&&f.type.startsWith('audio/'))handleFile(f);
}
function clearAudio(){
  pendingAudio=null;
  document.getElementById('af').value='';
  document.getElementById('ap').style.display='none';
  document.getElementById('azl').style.display='block';
}

function handleImg(file){
  if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    pendingImg={name:file.name,dataUrl:e.target.result};
    document.getElementById('imgn').textContent=file.name;
    document.getElementById('imgp').style.display='flex';
    document.getElementById('izl').style.display='none';
  };
  reader.readAsDataURL(file);
}
function handleImgDrop(e){
  e.preventDefault();
  document.getElementById('iz').classList.remove('drag');
  var f=e.dataTransfer.files[0];
  if(f&&f.type.startsWith('image/'))handleImg(f);
}
function clearImg(){
  pendingImg=null;
  document.getElementById('imgf').value='';
  document.getElementById('imgp').style.display='none';
  document.getElementById('izl').style.display='block';
}
// filters
var fb=document.getElementById('fbar');
CATS.forEach(function(c){
  var b=document.createElement('button');b.className='fc';b.dataset.c=c.id;
  b.textContent=c.label;b.onclick=function(){sf(c.id);};fb.appendChild(b);
});

// category grid
var cg=document.getElementById('cg');
CATS.forEach(function(c){
  var b=document.createElement('button');b.className='cb';b.dataset.c=c.id;
  b.textContent=c.label;b.onclick=function(){sc(c.id);};cg.appendChild(b);
});
sc('natural');

document.getElementById('fi').oninput=function(e){document.getElementById('il').textContent=INT[e.target.value];};
document.getElementById('ft').oninput=function(e){document.getElementById('bs').disabled=!e.target.value.trim();};

function mkIcon(cat,intensity){
  var col=COL[cat]||'#888';
  var dotPx=8+intensity*3; // dot diameter in px, grows with intensity
  var pad=dotPx*2.5;       // padding for rings to expand into
  var s=Math.round(dotPx+pad*2);
  var speed=(2.8-intensity*0.3).toFixed(1); // faster pulse for louder sounds
  var html="<div class=\'sm-marker\' style=\'width:"+s+"px;height:"+s+"px;\'>"+
    "<div class=\'sm-ring\' style=\'color:"+col+";--dot-size:"+dotPx+"px;animation-duration:"+speed+"s;\'></div>"+
    "<div class=\'sm-ring\' style=\'color:"+col+";--dot-size:"+dotPx+"px;animation-duration:"+speed+"s;\'></div>"+
    "<div class=\'sm-ring\' style=\'color:"+col+";--dot-size:"+dotPx+"px;animation-duration:"+speed+"s;\'></div>"+
    "<div class=\'sm-dot\' style=\'width:"+dotPx+"px;height:"+dotPx+"px;background:"+col+";opacity:0.92;\'></div>"+
    "</div>";
  return L.divIcon({html:html,className:'',iconSize:[s,s],iconAnchor:[s/2,s/2]});
}

function puHTML(m){
  var col=COL[m.category]||'#888';
  var h="<div class='pu'><div class='pu-cat' style='color:"+col+"'>"+m.category+"</div><div class='pu-title'>"+m.title+"</div>";
  if(m.place)h+="<div class='pu-loc'>"+m.place+"</div>";
  if(m.description)h+="<div class='pu-desc'>"+m.description+"</div>";
  if(m.audio)h+="<div class='pu-audio'><audio controls preload='none' src='"+m.audio+"'></audio></div>";
  h+="<div class='pu-meta'><span>"+INT[m.intensity]+"</span><span>"+(m.contributor||'Anonymous')+"</span><span>"+new Date(m.date).toLocaleDateString()+"</span></div>";
  h+="</div>";
  return h;
}

function rm(){
  Object.values(lms).forEach(function(l){map.removeLayer(l);});lms={};
  var fl=filt==='all'?marks:marks.filter(function(m){return m.category===filt;});
  fl.forEach(function(m){
    lms[m.id]=L.marker(m.position,{icon:mkIcon(m.category,m.intensity)}).addTo(map).bindPopup(puHTML(m),{maxWidth:340});
  });ui();
}

function ui(){
  document.getElementById('cnt').textContent=marks.length;
  document.querySelectorAll('.fc').forEach(function(b){
    var c=b.dataset.c,n=c==='all'?marks.length:marks.filter(function(m){return m.category===c;}).length;
    b.textContent=c==='all'?'All ('+n+')':CATS.find(function(x){return x.id===c;}).label+' ('+n+')';
  });rl();
}

function rl(){
  var rows=document.getElementById('l-rows');rows.innerHTML='';
  var fl=filt==='all'?marks:marks.filter(function(m){return m.category===filt;});
  document.getElementById('l-empty').style.display=fl.length===0?'block':'none';
  fl.forEach(function(m){
    var col=COL[m.category]||'#888',div=document.createElement('div');div.className='l-row';
    var desc=m.description?m.description.slice(0,60)+(m.description.length>60?'…':''):'';
    var ac=m.audio?"<button class='l-audio-btn' onclick='playAudio(\""+m.id+"\")'>&#9654; Play</button>":"<span style='color:var(--faint);font-size:0.55rem'>—</span>";
    div.innerHTML="<div><div class='l-title'>"+m.title+"</div>"+(desc?"<div class='l-sub'>"+desc+"</div>":"")+"</div>"
      +"<div class='l-loc'>"+(m.place||'—')+"</div>"
      +"<div style='font-size:0.6rem;color:"+col+";font-family:var(--mono);letter-spacing:0.06em'>"+m.category+"</div>"
      +"<div class='l-int'>"+INT[m.intensity]+"</div>"
      +"<div>"+ac+"</div>"
      +"<div><button class='l-del' onclick='dm(\""+m.id+"\")'>×</button></div>";
    rows.appendChild(div);
  });
}

var activeAudio=null;
function playAudio(id){
  var m=marks.find(function(x){return x.id===id;});
  if(!m||!m.audio)return;
  if(activeAudio){activeAudio.pause();activeAudio=null;}
  activeAudio=new Audio(m.audio);activeAudio.play();
}

function sf(c){
  filt=c;
  document.querySelectorAll('.fc').forEach(function(b){b.classList.toggle('on',b.dataset.c===c);});
  rm();
}

function openM(ll){
  document.getElementById('mo').classList.add('on');
  document.getElementById('mc').textContent=ll.lat.toFixed(4)+'°,  '+ll.lng.toFixed(4)+'°';
  ['ft','fd','fn'].forEach(function(id){document.getElementById(id).value='';});
  document.getElementById('fi').value=2;document.getElementById('il').textContent='Moderate';
  document.getElementById('bs').disabled=true;clearAudio();clearImg();sc('natural');
}
function cm(){document.getElementById('mo').classList.remove('on');plng=null;pplace='';}

function sc(id){
  scat=id;
  document.querySelectorAll('.cb').forEach(function(b){b.classList.toggle('on',b.dataset.c===id);});
}

function saveM(){
  var t=document.getElementById('ft').value.trim();if(!t||!plng)return;
  var id='sm-'+Date.now()+'-'+Math.random().toString(36).slice(2);
  var m={id:id,title:t,
    description:document.getElementById('fd').value.trim(),category:scat,
    intensity:+document.getElementById('fi').value,contributor:document.getElementById('fn').value.trim(),
    position:[plng.lat,plng.lng],place:pplace,date:new Date().toISOString(),
    audio:pendingAudio?pendingAudio.dataUrl:null,
    waveform:pendingAudio?pendingAudio.waveform:null,
    image:pendingImg?pendingImg.dataUrl:null};
  marksRef.child(id).set(m).catch(function(e){
    alert('Could not save — check your connection. ('+e.message+')');
  });
  cm();
  setTimeout(function(){if(lms[id])lms[id].openPopup();},600);
}

function dm(id){
  marksRef.child(id).remove().catch(function(e){alert('Could not remove mark.');});
  if(lms[id]){map.removeLayer(lms[id]);delete lms[id];}
  map.closePopup();
}

function sv(v){
  document.getElementById('t-map').classList.toggle('on',v==='map');
  document.getElementById('t-list').classList.toggle('on',v==='list');
  document.getElementById('listv').classList.toggle('on',v==='list');
  if(v==='map')map.invalidateSize();
}

sf('all');
</script>
