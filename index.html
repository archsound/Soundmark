<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>soundmarks</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@300;400;600&family=Overpass+Mono:wght@300;400&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f8f8f6;--surf:#ffffff;--rule:#dedbd4;--rule2:#eeecea;
  --text:#1a1a16;--dim:#5a5854;--faint:#9a9890;
  --serif:'Cormorant',Georgia,serif;
  --mono:'Overpass Mono',monospace;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--mono);overflow:hidden;}
#shell{display:grid;grid-template-rows:auto auto 1fr;height:100vh;}

/* header */
#hd{display:flex;align-items:center;justify-content:space-between;padding:1.2rem 2rem;border-bottom:1px solid var(--rule);gap:1rem;background:var(--bg);}
#wordmark{font-family:var(--serif);font-weight:600;font-size:clamp(1.8rem,4vw,3rem);letter-spacing:0.2em;color:var(--text);text-transform:uppercase;}
#hd-right{display:flex;align-items:center;gap:1rem;}
#mark-count{font-size:0.62rem;color:var(--dim);letter-spacing:0.08em;text-transform:uppercase;white-space:nowrap;}
#mark-count b{color:var(--text);}
.hd-divider{width:1px;height:1.2rem;background:var(--rule);}
.view-btn{font-family:var(--mono);font-size:0.6rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--dim);background:none;border:none;cursor:pointer;padding:0.2rem 0;border-bottom:1px solid transparent;transition:all 0.1s;}
.view-btn.on{color:var(--text);border-bottom-color:var(--text);}
.view-btn:hover{color:var(--text);}
.theme-btn{font-family:var(--mono);font-size:0.58rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--dim);background:none;border:1px solid var(--rule);cursor:pointer;padding:0.22rem 0.55rem;transition:all 0.1s;}
.theme-btn:hover{border-color:var(--dim);color:var(--text);}
.theme-btn.on{background:var(--text);color:var(--bg);border-color:var(--text);}

/* filter bar */
#fbar{display:flex;align-items:center;padding:0.4rem 2rem;border-bottom:1px solid var(--rule2);overflow-x:auto;gap:0;background:var(--bg);}
#fbar::-webkit-scrollbar{display:none;}
.fl{font-size:0.55rem;color:var(--faint);margin-right:1rem;letter-spacing:0.12em;text-transform:uppercase;white-space:nowrap;flex-shrink:0;}
.fc{font-size:0.58rem;color:var(--dim);background:none;border:none;cursor:pointer;padding:0.25rem 0.7rem 0.25rem 0;white-space:nowrap;transition:color 0.1s;border-bottom:1px solid transparent;letter-spacing:0.1em;text-transform:uppercase;}
.fc.on{color:var(--text);border-bottom-color:var(--text);}
.fc:hover{color:var(--text);}

/* map */
#stage{position:relative;overflow:hidden;}
#map{width:100%;height:100%;}
.leaflet-tile-pane{filter:saturate(0.7) brightness(1.01);}
.leaflet-control-zoom{border:1px solid var(--rule)!important;border-radius:0!important;box-shadow:none!important;}
.leaflet-control-zoom a{background:var(--surf)!important;color:var(--text)!important;border-color:var(--rule)!important;border-radius:0!important;font-family:var(--mono)!important;font-weight:300!important;width:26px!important;height:26px!important;line-height:24px!important;}
.leaflet-control-zoom a:hover{background:var(--text)!important;color:var(--bg)!important;}
.leaflet-control-attribution{background:rgba(248,248,246,0.9)!important;color:var(--faint)!important;font-family:var(--mono)!important;font-size:0.5rem!important;}
.leaflet-control-attribution a{color:var(--faint)!important;}
.leaflet-popup-content-wrapper{background:var(--surf);border:1px solid var(--rule);border-radius:0;box-shadow:3px 3px 0 var(--rule2);padding:0;font-family:var(--mono);}
.leaflet-popup-content{margin:0;width:auto!important;}
.leaflet-popup-tip-container{display:none;}
.leaflet-popup-close-button{color:var(--dim)!important;top:10px!important;right:12px!important;}
.leaflet-popup-close-button:hover{color:var(--text)!important;}

/* hint */
#hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:var(--surf);border:1px solid var(--rule);padding:0.28rem 0.9rem;font-size:0.56rem;color:var(--dim);z-index:700;pointer-events:none;letter-spacing:0.1em;text-transform:uppercase;white-space:nowrap;}

/* search */
#sbox{position:absolute;top:10px;right:10px;z-index:700;display:flex;flex-direction:column;width:240px;}
#sbox-row{display:flex;border:1px solid var(--rule);background:var(--surf);}
#si{padding:0.38rem 0.65rem;font-size:0.62rem;font-family:var(--mono);background:none;border:none;color:var(--text);outline:none;flex:1;}
#si::placeholder{color:var(--faint);}
#sb{padding:0.38rem 0.65rem;background:var(--rule);color:var(--dim);border:none;font-family:var(--mono);font-size:0.62rem;cursor:pointer;letter-spacing:0.08em;text-transform:uppercase;}
#sb:hover{background:var(--text);color:var(--bg);}
#sugs{background:var(--surf);border:1px solid var(--rule);border-top:none;display:none;flex-direction:column;max-height:200px;overflow-y:auto;}
#sugs.open{display:flex;}
.sug{padding:0.45rem 0.65rem;font-size:0.58rem;color:var(--dim);cursor:pointer;border-bottom:1px solid var(--rule2);line-height:1.4;}
.sug:last-child{border-bottom:none;}
.sug:hover{background:var(--rule2);color:var(--text);}
.sug-main{color:var(--text);font-size:0.62rem;}
.sug-sub{font-size:0.52rem;color:var(--faint);margin-top:0.08rem;}

/* animated markers */
.sm-marker{position:relative;display:flex;align-items:center;justify-content:center;}
.sm-dot{border-radius:50%;position:relative;z-index:2;flex-shrink:0;}
.sm-ring{position:absolute;border-radius:50%;border:1px solid currentColor;top:50%;left:50%;transform:translate(-50%,-50%);animation:ripple 2.4s ease-out infinite;opacity:0;}
.sm-ring:nth-child(2){animation-delay:0s;}
.sm-ring:nth-child(3){animation-delay:0.8s;}
.sm-ring:nth-child(4){animation-delay:1.6s;}
@keyframes ripple{0%{width:var(--dot-size);height:var(--dot-size);opacity:0.65;}100%{width:calc(var(--dot-size)*4.5);height:calc(var(--dot-size)*4.5);opacity:0;}}

/* list view */
#listv{display:none;position:absolute;inset:0;background:var(--bg);overflow-y:auto;z-index:600;}
#listv.on{display:block;}
#listv-inner{padding:2rem;max-width:1000px;}
.l-empty{padding:3rem 0;color:var(--dim);font-size:0.75rem;}
.l-head{display:grid;grid-template-columns:2.2fr 1fr 0.8fr 0.7fr 0.5fr auto;gap:1rem;padding:0 0 0.6rem;font-size:0.54rem;color:var(--faint);letter-spacing:0.14em;text-transform:uppercase;border-bottom:1px solid var(--text);}
.l-row{display:grid;grid-template-columns:2.2fr 1fr 0.8fr 0.7fr 0.5fr auto;gap:1rem;align-items:center;padding:0.75rem 0;border-bottom:1px solid var(--rule2);}
.l-title{font-family:var(--serif);font-size:1.1rem;font-weight:400;color:var(--text);line-height:1.2;}
.l-sub{font-size:0.62rem;color:var(--dim);margin-top:0.1rem;}
.l-loc{color:var(--dim);font-size:0.6rem;}
.l-int{color:var(--dim);font-size:0.6rem;}
.l-audio-btn{background:none;border:1px solid var(--rule);color:var(--dim);cursor:pointer;font-size:0.56rem;font-family:var(--mono);padding:0.18rem 0.45rem;letter-spacing:0.06em;text-transform:uppercase;}
.l-audio-btn:hover{border-color:var(--text);color:var(--text);}
.l-del{background:none;border:none;color:var(--faint);cursor:pointer;font-size:0.85rem;font-family:var(--mono);}
.l-del:hover{color:#a03030;}

/* modal */
#mo{display:none;position:fixed;inset:0;z-index:2000;background:rgba(200,198,194,0.7);backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:1rem;}
#mo.on{display:flex;}
#md{background:var(--surf);border:1px solid var(--rule);width:100%;max-width:480px;max-height:92vh;overflow-y:auto;box-shadow:5px 5px 0 var(--rule);animation:pop 0.15s ease;}
@keyframes pop{from{transform:translate(3px,6px);opacity:0}to{transform:translate(0,0);opacity:1}}
.md-head{padding:1.2rem 1.4rem 1rem;border-bottom:1px solid var(--rule);display:flex;align-items:flex-start;justify-content:space-between;position:sticky;top:0;background:var(--surf);z-index:1;}
.md-label{font-size:0.54rem;color:var(--dim);letter-spacing:0.16em;text-transform:uppercase;margin-bottom:0.3rem;}
.md-coords{font-family:var(--serif);font-weight:300;font-size:1.5rem;color:var(--text);line-height:1;}
.md-place{font-size:0.68rem;color:var(--dim);margin-top:0.25rem;}
.md-x{background:none;border:none;font-size:1.1rem;color:var(--faint);cursor:pointer;line-height:1;}
.md-x:hover{color:var(--text);}
.md-body{padding:1.1rem 1.4rem;}
.md-field{margin-bottom:0.9rem;}
.md-field label{display:block;font-size:0.54rem;color:var(--dim);letter-spacing:0.14em;text-transform:uppercase;margin-bottom:0.35rem;}
.md-field input[type=text],.md-field textarea{width:100%;background:none;border:none;border-bottom:1px solid var(--rule);padding:0.3rem 0;font-size:0.95rem;font-family:var(--serif);font-weight:300;color:var(--text);outline:none;resize:none;transition:border-color 0.15s;}
.md-field input[type=text]:focus,.md-field textarea:focus{border-bottom-color:var(--text);}
.md-field input[type=text]::placeholder,.md-field textarea::placeholder{color:var(--dim);}
.md-field textarea{height:56px;}
.md-field input[type=range]{-webkit-appearance:none;width:100%;height:1px;background:var(--rule);margin:0.6rem 0 0.2rem;cursor:pointer;}
.md-field input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:9px;height:9px;background:var(--text);border-radius:50%;}
.int-row{display:flex;justify-content:space-between;font-size:0.54rem;color:var(--faint);letter-spacing:0.06em;}
.int-val{font-size:0.82rem;color:var(--dim);}
.cat-row{display:flex;flex-wrap:wrap;gap:0.28rem;margin-top:0.28rem;}
.cb{font-size:0.58rem;padding:0.22rem 0.55rem;border:1px solid var(--rule);background:none;color:var(--dim);cursor:pointer;letter-spacing:0.08em;text-transform:uppercase;transition:all 0.1s;}
.cb.on{background:var(--text);color:var(--bg);border-color:var(--text);}
.cb:hover:not(.on){border-color:var(--text);color:var(--text);}
.audio-zone{border:1px dashed var(--rule);padding:0.8rem;text-align:center;cursor:pointer;position:relative;transition:border-color 0.15s;}
.audio-zone:hover,.audio-zone.drag{border-color:var(--dim);}
.audio-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.audio-zone-lbl{font-size:0.75rem;color:var(--dim);pointer-events:none;}
.audio-zone-lbl b{color:var(--text);font-weight:400;}
.audio-preview{margin-top:0.4rem;display:flex;align-items:center;gap:0.5rem;}
.audio-name{font-size:0.6rem;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px;}
.audio-clear{background:none;border:none;color:var(--faint);cursor:pointer;font-size:0.8rem;}
.audio-clear:hover{color:#a03030;}
.md-foot{display:flex;gap:0.5rem;padding:0 1.4rem 1.2rem;}
.btn-c{padding:0.5rem 1rem;background:none;border:1px solid var(--rule);color:var(--dim);font-family:var(--mono);font-size:0.6rem;cursor:pointer;letter-spacing:0.1em;text-transform:uppercase;}
.btn-c:hover{border-color:var(--text);color:var(--text);}
.btn-s{flex:1;padding:0.5rem 1rem;background:var(--text);border:1px solid var(--text);color:var(--bg);font-family:var(--mono);font-size:0.6rem;cursor:pointer;letter-spacing:0.1em;text-transform:uppercase;}
.btn-s:hover{opacity:0.82;}
.btn-s:disabled{background:var(--rule);border-color:var(--rule);color:var(--faint);cursor:not-allowed;opacity:1;}

/* popup */
.pu{padding:1rem 1.1rem 0.9rem;min-width:210px;max-width:280px;}
.pu-cat{font-size:0.54rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--dim);margin-bottom:0.3rem;}
.pu-title{font-family:var(--serif);font-weight:400;font-size:1.2rem;color:var(--text);margin-bottom:0.2rem;line-height:1.2;}
.pu-loc{font-size:0.64rem;color:var(--dim);margin-bottom:0.45rem;}
.pu-desc{font-size:0.7rem;color:var(--dim);line-height:1.55;margin-bottom:0.5rem;}
.pu-audio{margin-bottom:0.5rem;}
.pu-audio audio{width:100%;height:22px;}
.pu-meta{display:flex;gap:0.5rem;font-size:0.56rem;color:var(--faint);flex-wrap:wrap;padding-top:0.4rem;border-top:1px solid var(--rule);}

::-webkit-scrollbar{width:2px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--rule);}

/* mobile */
@media(max-width:640px){
  /* Header — two rows on mobile */
  #hd{flex-wrap:wrap;padding:0.75rem 1rem;gap:0.5rem;}
  #wordmark{font-size:1.6rem;letter-spacing:0.15em;flex:1;}
  #hd-right{width:100%;justify-content:space-between;gap:0.5rem;flex-wrap:wrap;}
  #mark-count{display:none;}
  .hd-divider{display:none;}
  .view-btn{font-size:0.7rem;min-height:36px;padding:0.3rem 0.5rem;}
  .theme-btn{font-size:0.65rem;min-height:36px;padding:0.3rem 0.6rem;}

  /* Filter bar — scrollable, bigger tap targets */
  #fbar{padding:0 1rem;min-height:36px;}
  .fl{display:none;}
  .fc{font-size:0.65rem;padding:0 0.7rem;min-height:36px;line-height:36px;}

  /* Search — full width, below map controls */
  #sbox{width:calc(100% - 16px);left:8px;right:8px;top:8px;}
  #si{font-size:0.75rem;padding:0.55rem 0.7rem;}
  #sb{font-size:0.7rem;padding:0.55rem 0.7rem;min-height:40px;}
  .sug{padding:0.6rem 0.7rem;font-size:0.68rem;}
  .sug-main{font-size:0.72rem;}

  /* Hint */
  #hint{font-size:0.6rem;bottom:10px;padding:0.25rem 0.7rem;}

  /* Modal — full screen sheet from bottom */
  #mo{padding:0;align-items:flex-end;}
  #md{max-width:100%;max-height:90vh;border-left:none;border-right:none;border-bottom:none;box-shadow:0 -3px 12px rgba(0,0,0,0.08);border-radius:0;}
  .md-head{padding:1rem 1.1rem 0.8rem;}
  .md-coords{font-size:1.3rem;}
  .md-body{padding:0.8rem 1.1rem;}
  .md-field{margin-bottom:0.75rem;}
  .md-field label{font-size:0.6rem;}
  .md-field input[type=text],.md-field textarea{font-size:1rem;padding:0.4rem 0;}
  .md-field textarea{height:52px;}
  .cat-row{gap:0.35rem;}
  .cb{font-size:0.68rem;padding:0.35rem 0.65rem;min-height:36px;}
  .md-foot{padding:0.5rem 1.1rem 1.2rem;gap:0.4rem;}
  .btn-c,.btn-s{font-size:0.68rem;min-height:46px;padding:0.6rem 1rem;}

  /* Audio recorder */
  .audio-tab{font-size:0.65rem;padding:0.35rem 0.8rem 0.35rem 0;min-height:36px;}
  #rec-btn{font-size:0.65rem;min-height:40px;padding:0.4rem 0.8rem;}
  #rec-timer{font-size:0.68rem;}

  /* Index list */
  #listv-inner{padding:0.8rem 1rem;}
  .l-head{display:none;}
  .l-row{grid-template-columns:1fr auto;grid-template-rows:auto auto;gap:0.3rem 0.5rem;padding:0.65rem 0;}
  .l-loc,.l-int{display:none;}
  .l-title{font-size:1rem;}
  .l-del{font-size:1rem;min-height:36px;min-width:36px;}
}

/* ── Recorder ── */
.audio-tabs{display:flex;gap:0;margin-bottom:0.5rem;border-bottom:1px solid var(--rule);}
.audio-tab{font-family:var(--mono);font-size:0.56rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--dim);background:none;border:none;cursor:pointer;padding:0.3rem 0.7rem 0.3rem 0;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all 0.1s;}
.audio-tab.on{color:var(--text);border-bottom-color:var(--text);}
.audio-tab:hover{color:var(--text);}
.audio-panel{display:none;}
.audio-panel.on{display:block;}
#rec-controls{display:flex;align-items:center;gap:0.6rem;padding:0.6rem 0;}
#rec-btn{font-family:var(--mono);font-size:0.58rem;letter-spacing:0.1em;text-transform:uppercase;background:none;border:1px solid var(--rule);color:var(--dim);cursor:pointer;padding:0.35rem 0.7rem;transition:all 0.1s;display:flex;align-items:center;gap:0.4rem;}
#rec-btn:hover{border-color:var(--text);color:var(--text);}
#rec-btn.recording{border-color:#c03030;color:#c03030;}
#rec-dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0;}
#rec-btn.recording #rec-dot{animation:blink 0.9s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.2;}}
#rec-timer{font-family:var(--mono);font-size:0.62rem;color:var(--dim);min-width:40px;}
#rec-preview{margin-top:0.4rem;display:none;flex-direction:column;gap:0.4rem;}
#rec-preview.on{display:flex;}
#rec-audio{width:100%;height:22px;}
#rec-discard{font-family:var(--mono);font-size:0.56rem;color:var(--faint);background:none;border:none;cursor:pointer;text-decoration:underline;text-align:left;letter-spacing:0.04em;}
#rec-discard:hover{color:#a03030;}

/* ── Live waveform visualizer ── */
#rec-canvas-wrap{display:none;margin:0.4rem 0;border:1px solid var(--rule);background:var(--surf);height:52px;overflow:hidden;}
#rec-canvas-wrap.on{display:block;}
#rec-canvas{width:100%;height:52px;display:block;}

/* locate button */
#locate-btn{position:absolute;top:80px;left:10px;z-index:700;width:26px;height:26px;background:var(--surf);border:1px solid var(--rule);color:var(--dim);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:0.9rem;transition:all 0.1s;}
#locate-btn:hover{background:var(--text);color:var(--bg);}
#locate-btn.locating{animation:spin 1s linear infinite;color:var(--text);}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div id="shell">
  <div id="hd">
    <div id="wordmark">Soundmarks</div>
    <div id="hd-right">
      <span id="mark-count"><b id="cnt">0</b> marks</span>
      <div class="hd-divider"></div>
      <button class="view-btn on" id="t-map" onclick="sv('map')">Map</button>
      <button class="view-btn" id="t-list" onclick="sv('list')">Index</button>
      <div class="hd-divider"></div>
      <button class="theme-btn on" id="sat-btn" onclick="toggleSat()">Color</button>
      <button class="theme-btn" id="inv-btn" onclick="toggleInvert()">Invert</button>
    </div>
  </div>
  <div id="fbar">
    <span class="fl">Filter —</span>
    <button class="fc on" data-c="all" onclick="sf('all')">All</button>
  </div>
  <div id="stage">
    <div id="map"></div>
    <button id="locate-btn" onclick="locateMe()" title="Go to my location">◎</button>
    <div id="hint">Click anywhere to mark a sound</div>
    <div id="sbox">
      <div id="sbox-row">
        <input id="si" placeholder="Search a place…" autocomplete="off"/>
        <button id="sb" onclick="sp()">Go</button>
      </div>
      <div id="sugs"></div>
    </div>
    <div id="listv">
      <div id="listv-inner">
        <div class="l-head"><span>Title</span><span>Location</span><span>Category</span><span>Intensity</span><span>Audio</span><span></span></div>
        <div id="l-rows"></div>
        <div class="l-empty" id="l-empty" style="display:none">No soundmarks yet.</div>
      </div>
    </div>
  </div>
</div>

<div id="mo">
  <div id="md">
    <div class="md-head">
      <div>
        <div class="md-label">New Soundmark</div>
        <div class="md-coords" id="mc"></div>
        <div class="md-place" id="mpl"></div>
      </div>
      <button class="md-x" onclick="cm()">×</button>
    </div>
    <div class="md-body">
      <div class="md-field"><label>Category</label><div class="cat-row" id="cg"></div></div>
      <div class="md-field"><label>Title *</label><input type="text" id="ft" placeholder="Name this sound…"/></div>
      <div class="md-field"><label>Description</label><textarea id="fd" placeholder="What do you hear?"></textarea></div>
      <div class="md-field">
        <label>Intensity — <span class="int-val" id="il">Moderate</span></label>
        <input type="range" id="fi" min="0" max="4" value="2"/>
        <div class="int-row"><span>Very Quiet</span><span>Very Loud</span></div>
      </div>
      <div class="md-field">
        <label>Sound <span style="color:var(--faint);text-transform:none;letter-spacing:0">(optional)</span></label>
        <div class="audio-tabs">
          <button class="audio-tab on" id="tab-rec" onclick="switchAudioTab('rec')">Record</button>
          <button class="audio-tab" id="tab-upload" onclick="switchAudioTab('upload')">Upload</button>
        </div>
        <!-- Record panel -->

    </div>
  </div>
</div>

<script>

// Firebase

function rg(ll){
  return fetch('https://nominatim.openstreetmap.org/reverse?lat='+ll.lat+'&lon='+ll.lng+'&format=json')
    .then(function(r){return r.json();})
    .then(function(d){var a=d.address||{};return[a.city||a.town||a.village||a.hamlet||a.county,a.country].filter(Boolean).join(', ')||'';})

// Search
var sugTimer=null;
var siEl=document.getElementById('si');
var sugsEl=document.getElementById('sugs');
siEl.addEventListener('input',function(){
  var q=siEl.value.trim();clearTimeout(sugTimer);
  if(q.length<2){closeSugs();return;}
  sugTimer=setTimeout(function(){
    fetch('https://nominatim.openstreetmap.org/search?q='+encodeURIComponent(q)+'&format=json&limit=6&addressdetails=1')
      .then(function(r){return r.json();})
      .then(function(results){
        sugsEl.innerHTML='';
        if(!results.length){closeSugs();return;}
        results.forEach(function(r){
          var parts=r.display_name.split(',');

          var div=document.createElement('div');div.className='sug';
          div.innerHTML="<div class='sug-main'>"+main+"</div>"+(sub?"<div class='sug-sub'>"+sub+"</div>":"");
          div.addEventListener('click',function(){map.setView([+r.lat,+r.lon],12);siEl.value=main;closeSugs();});
          sugsEl.appendChild(div);

        sugsEl.classList.add('open');
      }).catch(function(){});

});

function sp(){

// Audio
function handleFile(file){
  if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    pendingAudio={name:file.name,dataUrl:e.target.result};

}
function handleDrop(e){

function clearAudio(){

// Theme toggles
function applyTheme(){
  var sat=isSat?1:0;
  // Tile filter: invert map tiles in dark mode, always apply sat to tiles
  var tilef=isInv?'invert(1) hue-rotate(180deg) saturate('+(isSat?0.7:0)+') brightness(1.01)':'saturate('+(isSat?0.7:0)+') brightness(1.01)';
  document.querySelector('.leaflet-tile-pane').style.filter=tilef;
  // Only desaturate UI chrome (header, fbar, modal) — NOT the map or markers
  var uiSat='saturate('+sat+')';
  document.getElementById('hd').style.filter=uiSat;
  document.getElementById('fbar').style.filter=uiSat;
  document.getElementById('mo').style.filter=uiSat;
  // CSS variable swap for dark/light mode (affects all var() colors)
  var r=document.documentElement;
  if(isInv){
    r.style.setProperty('--bg','#111110');r.style.setProperty('--surf','#1c1c1a');
    r.style.setProperty('--rule','#303030');r.style.setProperty('--rule2','#242422');
    r.style.setProperty('--text','#f0ece4');r.style.setProperty('--dim','#aaa8a0');
    r.style.setProperty('--faint','#888480');
  } else {
    r.style.setProperty('--bg','#f8f8f6');r.style.setProperty('--surf','#ffffff');
    r.style.setProperty('--rule','#dedbd4');r.style.setProperty('--rule2','#eeecea');
    r.style.setProperty('--text','#1a1a16');r.style.setProperty('--dim','#5a5854');
    r.style.setProperty('--faint','#9a9890');
  }
}

document.getElementById('fi').oninput=function(e){document.getElementById('il').textContent=INT[e.target.value];};
document.getElementById('ft').oninput=function(e){document.getElementById('bs').disabled=!e.target.value.trim();};

function mkIcon(cat,intensity,waveenv){
  var col=COL[cat]||'#888',dotPx=8+intensity*3,pad=dotPx*2.5,s=Math.round(dotPx+pad*2);
  var mid=s/2;
  if(waveenv&&waveenv.length){
    // Canvas marker — driven by waveform envelope
    var uid='wm-'+Math.random().toString(36).slice(2,8);
    var html="<canvas id='"+uid+"' width='"+s+"' height='"+s+"' style='display:block;'></canvas>";
    var icon=L.divIcon({html:html,className:'',iconSize:[s,s],iconAnchor:[mid,mid]});
    // Start animation after Leaflet adds the canvas to DOM
    setTimeout(function(){
      var canvas=document.getElementById(uid);
      if(!canvas)return;
      var ctx=canvas.getContext('2d');
      var env=waveenv;
      var frame=0;
      var fps=30;
      var loopLen=env.length;
      (function animate(){
        requestAnimationFrame(animate);
        ctx.clearRect(0,0,s,s);
        // Draw 3 rings whose radius pulses with envelope
        var t=frame%loopLen;
        for(var r=0;r<3;r++){
          var envIdx=Math.floor((t+(r*(loopLen/3)))%loopLen);
          var amp=env[envIdx];
          var radius=dotPx/2 + (pad*0.3) + amp*(pad*0.65);
          var opacity=0.15+amp*0.55;
          ctx.beginPath();
          ctx.arc(mid,mid,radius,0,Math.PI*2);
          ctx.strokeStyle=col;
          ctx.globalAlpha=opacity;
          ctx.lineWidth=1.2;
          ctx.stroke();
        }
        ctx.globalAlpha=1;
        // Center dot
        ctx.beginPath();
        ctx.arc(mid,mid,dotPx/2,0,Math.PI*2);
        ctx.fillStyle=col;
        ctx.globalAlpha=0.9;
        ctx.fill();
        ctx.globalAlpha=1;
        frame++;
      })();
    },120);
    return icon;
  } else {
    // No waveform — fall back to CSS ripple rings
    var speed=(2.8-intensity*0.3).toFixed(1);
    var html="<div class='sm-marker' style='width:"+s+"px;height:"+s+"px;'>"
      +"<div class='sm-ring' style='color:"+col+";--dot-size:"+dotPx+"px;animation-duration:"+speed+"s;'></div>"
      +"<div class='sm-ring' style='color:"+col+";--dot-size:"+dotPx+"px;animation-duration:"+speed+"s;'></div>"
      +"<div class='sm-ring' style='color:"+col+";--dot-size:"+dotPx+"px;animation-duration:"+speed+"s;'></div>"
      +"<div class='sm-dot' style='width:"+dotPx+"px;height:"+dotPx+"px;background:"+col+";opacity:0.9;'></div>"
      +"</div>";
    return L.divIcon({html:html,className:'',iconSize:[s,s],iconAnchor:[mid,mid]});
  }
}

function puHTML(m){
  var col=COL[m.category]||'#888';
  var h="<div class='pu'><div class='pu-cat' style='color:"+col+"'>"+m.category+"</div>"
    +"<div class='pu-title'>"+m.title+"</div>";
  if(m.place)h+="<div class='pu-loc'>"+m.place+"</div>";
  if(m.description)h+="<div class='pu-desc'>"+m.description+"</div>";
  if(m.audio)h+="<div class='pu-audio'><audio controls preload='none' src='"+m.audio+"'></audio></div>";
  h+="<div class='pu-meta'><span>"+INT[m.intensity]+"</span><span>"+(m.contributor||'Anonymous')+"</span><span>"+new Date(m.date).toLocaleDateString()+"</span></div>";
  if(isAdmin)h+="<button class='pu-del-btn' onclick=\"dm(\'"+m.id+"\')\">Remove</button>";
  h+="</div>";
  return h;
}

function rm(){
  Object.values(lms).forEach(function(l){map.removeLayer(l);});lms={};

function ui(){

// ── Audio tab switcher ──
function switchAudioTab(tab){

  document.getElementById('tab-upload').classList.toggle('on', tab==='upload');

// ── Recorder ──
var mediaRecorder=null, recChunks=[], recStream=null, recTimer=null, recSeconds=0;
var audioCtx=null, analyser=null, animFrame=null;

function toggleRecord(){
  if(mediaRecorder && mediaRecorder.state==='recording') stopRecording();
  else startRecording();
}

function startRecording(){
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    recStream=stream;
    recChunks=[];

    // Web Audio analyser
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    analyser=audioCtx.createAnalyser();
    analyser.fftSize=256;
    audioCtx.createMediaStreamSource(stream).connect(analyser);

    mediaRecorder=new MediaRecorder(stream);
    mediaRecorder.ondataavailable=function(e){if(e.data.size>0)recChunks.push(e.data);};
    mediaRecorder.onstop=function(){
      var blobType=mimeType||'audio/webm';
      var blob=new Blob(recChunks,{type:blobType});
      var ext=blobType.indexOf('mp4')!==-1?'mp4':blobType.indexOf('ogg')!==-1?'ogg':'webm';
      // Use blob URL for preview — works on all browsers including iOS Safari
      var blobUrl=URL.createObjectURL(blob);
      var audioEl=document.getElementById('rec-audio');
      audioEl.src=blobUrl;
      audioEl.load();
      document.getElementById('rec-preview').classList.add('on');
      // Also convert to base64 for storage (needed for Firebase)
      var reader=new FileReader();
      reader.onload=function(e){
        pendingAudio={name:'recording.'+ext,dataUrl:e.target.result,blob:blob};
      };
      reader.readAsDataURL(blob);
    };
    mediaRecorder.start();

    recSeconds=0;
    document.getElementById('rec-timer').textContent='0:00';
    recTimer=setInterval(function(){
      recSeconds++;
      var m=Math.floor(recSeconds/60),s=recSeconds%60;
      document.getElementById('rec-timer').textContent=m+':'+(s<10?'0':'')+s;
    },1000);
    document.getElementById('rec-btn').classList.add('recording');
    document.getElementById('rec-label').textContent='Stop';

    // Show and start canvas
    var wrap=document.getElementById('rec-canvas-wrap');
    wrap.classList.add('on');
    drawWave();
  }).catch(function(){alert('Microphone access denied.');});
}

function drawWave(){
  var canvas=document.getElementById('rec-canvas');
  var W=canvas.offsetWidth, H=canvas.offsetHeight;
  canvas.width=W; canvas.height=H;
  var ctx=canvas.getContext('2d');
  var bufLen=analyser.frequencyBinCount;
  var dataArr=new Uint8Array(bufLen);

  function frame(){
    animFrame=requestAnimationFrame(frame);
    analyser.getByteTimeDomainData(dataArr);

    // background
    var bg=getComputedStyle(document.documentElement).getPropertyValue('--surf').trim()||'#fff';
    ctx.fillStyle=bg;
    ctx.fillRect(0,0,W,H);

    // draw waveform line
    ctx.lineWidth=1.5;
    ctx.strokeStyle='#c03030';
    ctx.beginPath();
    var sliceW=W/bufLen;
    var x=0;
    for(var i=0;i<bufLen;i++){
      var v=dataArr[i]/128.0;
      var y=v*H/2;
      if(i===0) ctx.moveTo(x,y);
      else ctx.lineTo(x,y);
      x+=sliceW;
    }
    ctx.lineTo(W,H/2);
    ctx.stroke();
  }
  frame();
}

function stopRecording(){
  if(mediaRecorder && mediaRecorder.state==='recording'){
    mediaRecorder.stop();
    recStream.getTracks().forEach(function(t){t.stop();});
    clearInterval(recTimer);
    cancelAnimationFrame(animFrame);
    if(audioCtx){audioCtx.close();audioCtx=null;analyser=null;}
    document.getElementById('rec-btn').classList.remove('recording');
    document.getElementById('rec-label').textContent='Record again';
    document.getElementById('rec-canvas-wrap').classList.remove('on');
  }
}

function discardRecording(){
  pendingAudio=null;
  document.getElementById('rec-audio').src='';
  document.getElementById('rec-preview').classList.remove('on');
  document.getElementById('rec-btn').classList.remove('recording');
  document.getElementById('rec-label').textContent='Record';
  document.getElementById('rec-timer').textContent='';
  document.getElementById('rec-canvas-wrap').classList.remove('on');
  recSeconds=0;
}

function sf(c){
  filt=c;document.querySelectorAll('.fc').forEach(function(b){b.classList.toggle('on',b.dataset.c===c);});rm();
}

function openM(ll){
  document.getElementById('mo').classList.add('on');
  document.getElementById('mc').textContent=ll.lat.toFixed(4)+'°,  '+ll.lng.toFixed(4)+'°';
  ['ft','fd','fn'].forEach(function(id){document.getElementById(id).value='';});

function saveM(){
  var t=document.getElementById('ft').value.trim();if(!t||!plng)return;
  var id='sm-'+Date.now()+'-'+Math.random().toString(36).slice(2);
  var m={id:id,title:t,description:document.getElementById('fd').value.trim(),category:scat,
    intensity:+document.getElementById('fi').value,contributor:document.getElementById('fn').value.trim(),
    position:[plng.lat,plng.lng],place:pplace,date:new Date().toISOString(),
    audio:pendingAudio?pendingAudio.dataUrl:null,
    waveenv:null};
  function doSave(mark){
    marksRef.child(mark.id).set(mark).catch(function(e){alert('Could not save: '+e.message);});
    cm();setTimeout(function(){if(lms[mark.id])lms[mark.id].openPopup();},600);
  }
  if(pendingAudio&&pendingAudio.dataUrl){
    extractEnvelope(pendingAudio.dataUrl,function(env){
      m.waveenv=env;doSave(m);
    });
  } else {
    doSave(m);
  }
}

function extractEnvelope(dataUrl,cb){
  try{
    var actx=new(window.AudioContext||window.webkitAudioContext)();
    // convert dataUrl to ArrayBuffer
    var b64=dataUrl.split(',')[1];
    var bin=atob(b64);
    var buf=new ArrayBuffer(bin.length);
    var view=new Uint8Array(buf);
    for(var i=0;i<bin.length;i++)view[i]=bin.charCodeAt(i);
    actx.decodeAudioData(buf,function(decoded){
      var raw=decoded.getChannelData(0);
      var samples=80; // 80 envelope points
      var block=Math.floor(raw.length/samples);
      var env=[];
      for(var i=0;i<samples;i++){
        var sum=0;
        for(var j=0;j<block;j++)sum+=Math.abs(raw[i*block+j]);
        env.push(sum/block);
      }
      var mx=Math.max.apply(null,env)||1;
      env=env.map(function(v){return Math.round((v/mx)*100)/100;});
      actx.close();
      cb(env);
    },function(){cb(null);});
  }catch(e){cb(null);}
}

function dm(id){
  marksRef.child(id).remove();
  if(lms[id]){map.removeLayer(lms[id]);delete lms[id];}
  map.closePopup();
}

function sv(v){
  document.getElementById('t-map').classList.toggle('on',v==='map');
  document.getElementById('t-list').classList.toggle('on',v==='list');
  document.getElementById('listv').classList.toggle('on',v==='list');
  if(v==='map')map.invalidateSize();
}

sf('all');
