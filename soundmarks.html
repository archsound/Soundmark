<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>World Soundmarks</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #07101c; --surface: #0d1a2a; --border: #1a3050; --border2: #0f2035;
    --text: #c8ddf0; --muted: #4a6a8a; --accent: #f0a500;
    --font-mono: 'Special Elite', 'Courier New', monospace;
    --font-serif: 'IM Fell English', Georgia, serif;
  }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-mono); overflow: hidden; }
  #app { display: flex; flex-direction: column; height: 100vh; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.6rem 1.2rem;
    background: linear-gradient(135deg, #060e1a 0%, #091525 100%);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0; z-index: 900; gap: 1rem;
  }
  .logo { display: flex; align-items: center; gap: 0.7rem; }
  .logo-icon { width: 34px; height: 34px; border-radius: 8px; background: linear-gradient(135deg, #f0a50020, #f0a50044); border: 1px solid #f0a50044; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
  .logo-text { line-height: 1.2; }
  .logo-title { font-family: var(--font-serif); color: #e8f4ff; font-size: 1.05rem; font-style: italic; }
  .logo-sub { font-size: 0.58rem; color: var(--muted); letter-spacing: 0.14em; text-transform: uppercase; }
  .header-right { display: flex; align-items: center; gap: 0.6rem; flex-shrink: 0; }
  .badge { background: #0d1a2a; border: 1px solid var(--border); border-radius: 20px; padding: 0.2rem 0.65rem; font-size: 0.68rem; color: var(--muted); }
  .badge span { color: var(--accent); }
  .tab-group { display: flex; background: #060e1a; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
  .tab { padding: 0.28rem 0.7rem; border: none; cursor: pointer; background: transparent; color: var(--muted); font-size: 0.68rem; font-family: var(--font-mono); letter-spacing: 0.06em; transition: all 0.15s; }
  .tab.active { background: var(--border); color: #e8f4ff; }
  #filterbar { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; padding: 0.45rem 1.2rem; border-bottom: 1px solid var(--border2); background: var(--bg); flex-shrink: 0; z-index: 800; }
  .filter-label { font-size: 0.58rem; color: #1e3a5a; letter-spacing: 0.12em; margin-right: 0.2rem; }
  .fchip { padding: 0.18rem 0.55rem; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 0.62rem; cursor: pointer; font-family: var(--font-mono); transition: all 0.15s; white-space: nowrap; }
  #map-container { flex: 1; position: relative; overflow: hidden; min-height: 0; }
  #map { width: 100%; height: 100%; }
  .leaflet-tile { filter: brightness(0.85) saturate(0.7) hue-rotate(180deg) invert(1) hue-rotate(180deg) brightness(0.55) contrast(1.1); }
  .leaflet-control-attribution { background: rgba(7,16,28,0.85) !important; color: #2a4a70 !important; font-size: 9px !important; }
  .leaflet-control-attribution a { color: #3a6a9a !important; }
  .leaflet-control-zoom a { background: #0d1a2a !important; color: #7ea8d4 !important; border-color: #1a3050 !important; }
  .leaflet-control-zoom a:hover { background: #1a3050 !important; }
  .leaflet-popup-content-wrapper { background: #0d1a2a; border: 1px solid #1a3050; border-radius: 8px; color: #c8ddf0; box-shadow: 0 8px 32px rgba(0,0,0,0.6); }
  .leaflet-popup-tip { background: #0d1a2a; }
  .leaflet-popup-close-button { color: #4a6a8a !important; font-size: 16px !important; }
  #hint { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: rgba(7,16,28,0.92); border: 1px solid var(--border); border-radius: 20px; padding: 0.35rem 1rem; font-size: 0.7rem; color: var(--muted); z-index: 700; display: flex; align-items: center; gap: 0.5rem; pointer-events: none; backdrop-filter: blur(4px); white-space: nowrap; }
  .dot-pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 2s infinite; flex-shrink: 0; }
  #search-box { position: absolute; top: 12px; right: 12px; z-index: 700; display: flex; gap: 0.4rem; }
  #search-input { background: rgba(7,16,28,0.92); border: 1px solid var(--border); border-radius: 20px; padding: 0.35rem 0.9rem; font-size: 0.7rem; color: var(--text); font-family: var(--font-mono); backdrop-filter: blur(4px); width: 190px; outline: none; }
  #search-input:focus { border-color: var(--accent); }
  #search-btn { background: rgba(7,16,28,0.92); border: 1px solid var(--border); border-radius: 20px; padding: 0.35rem 0.75rem; font-size: 0.7rem; color: var(--accent); font-family: var(--font-mono); cursor: pointer; backdrop-filter: blur(4px); }
  #search-btn:hover { background: #0d1a2a; }
  #list-view { display: none; flex-direction: column; position: absolute; inset: 0; background: var(--bg); overflow-y: auto; padding: 1rem 1.2rem; gap: 0.65rem; z-index: 600; }
  #list-view.visible { display: flex; }
  .list-empty { text-align: center; padding: 4rem 1rem; color: #1e3a5a; }
  .list-empty .em { font-size: 2rem; display: block; margin-bottom: 0.5rem; }
  .list-card { background: var(--surface); border-radius: 8px; overflow: hidden; border: 1px solid var(--border2); }
  .list-card-header { padding: 0.6rem 0.85rem 0; }
  .list-card-wave { height: 18px; }
  .list-card-title { font-family: var(--font-serif); color: #e8f4ff; font-size: 0.9rem; line-height: 1.3; }
  .list-card-cat { font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; }
  .list-card-loc { font-size: 0.6rem; color: #2a4a6a; font-style: italic; margin-top: 0.1rem; }
  .list-card-desc { padding: 0.3rem 0.85rem 0; font-family: var(--font-serif); font-size: 0.75rem; color: #5a7a9a; line-height: 1.5; font-style: italic; }
  .list-card-meta { padding: 0.45rem 0.85rem; display: flex; justify-content: space-between; font-size: 0.62rem; color: var(--muted); flex-wrap: wrap; gap: 0.3rem; }
  .list-card-del { background: none; border: none; color: #ff6b6b55; cursor: pointer; font-size: 0.62rem; font-family: var(--font-mono); }
  .list-card-del:hover { color: #ff6b6b; }
  #modal-overlay { display: none; position: fixed; inset: 0; z-index: 2000; background: rgba(4,9,18,0.88); backdrop-filter: blur(5px); align-items: center; justify-content: center; padding: 1rem; }
  #modal-overlay.visible { display: flex; }
  #modal { background: #0a1622; border: 1px solid #1a3050; border-radius: 12px; width: 100%; max-width: 450px; overflow: hidden; box-shadow: 0 28px 80px rgba(0,0,0,0.75); animation: slideUp 0.2s ease; }
  @keyframes slideUp { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes pulse { 0%,100%{opacity:1;box-shadow:0 0 6px var(--accent)} 50%{opacity:0.5;box-shadow:0 0 14px var(--accent)} }
  .modal-header { background: linear-gradient(135deg, #091422 0%, #0d1e34 100%); padding: 1.1rem 1.3rem 0; border-bottom: 1px solid var(--border); }
  .modal-tag { display: flex; align-items: center; gap: 0.45rem; margin-bottom: 0.2rem; }
  .modal-tag .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 2s infinite; }
  .modal-tag span { font-size: 0.6rem; color: var(--accent); letter-spacing: 0.16em; text-transform: uppercase; }
  .modal-coords { font-size: 0.68rem; color: #4a6a8a; margin-bottom: 0.2rem; font-family: var(--font-serif); font-style: italic; }
  .modal-place { font-size: 0.75rem; color: #7ea8d4; margin-bottom: 0.6rem; font-family: var(--font-serif); }
  .modal-wave { height: 24px; }
  .modal-body { padding: 1.1rem 1.3rem; }
  label { display: block; font-size: 0.6rem; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 0.28rem; }
  .cat-grid { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-bottom: 0.9rem; }
  .cat-btn { padding: 0.25rem 0.55rem; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 0.68rem; cursor: pointer; font-family: var(--font-mono); transition: all 0.15s; }
  input[type=text], textarea { width: 100%; background: #060e1a; border: 1px solid var(--border); border-radius: 6px; padding: 0.45rem 0.7rem; color: #e8f4ff; font-size: 0.8rem; font-family: var(--font-serif); margin-bottom: 0.8rem; display: block; transition: border-color 0.15s; }
  input[type=text]:focus, textarea:focus { outline: none; border-color: var(--accent); }
  textarea { height: 72px; resize: vertical; }
  input[type=range] { -webkit-appearance: none; width: 100%; height: 4px; border-radius: 2px; background: var(--border); margin-bottom: 0.9rem; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; cursor: pointer; }
  .modal-actions { display: flex; gap: 0.65rem; margin-top: 0.3rem; }
  .btn-cancel { padding: 0.55rem 1rem; background: transparent; border: 1px solid var(--border); border-radius: 6px; color: var(--muted); font-family: var(--font-mono); font-size: 0.7rem; cursor: pointer; }
  .btn-save { flex: 1; padding: 0.55rem 1rem; border: 1px solid; border-radius: 6px; font-family: var(--font-mono); font-size: 0.7rem; cursor: pointer; transition: all 0.15s; letter-spacing: 0.04em; }
  .btn-save:disabled { background: #0f2035 !important; border-color: var(--border) !important; color: #2a4a70 !important; cursor: not-allowed; }
  .popup-wave { height: 16px; margin-bottom: 0.4rem; }
  .popup-title { font-family: var(--font-serif); font-size: 0.95rem; color: #e8f4ff; margin-bottom: 0.2rem; }
  .popup-cat { font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 0.3rem; }
  .popup-place { font-size: 0.68rem; color: #4a6a8a; font-style: italic; margin-bottom: 0.4rem; font-family: var(--font-serif); }
  .popup-desc { font-family: var(--font-serif); font-size: 0.75rem; color: #5a7a9a; font-style: italic; line-height: 1.5; margin-bottom: 0.5rem; }
  .popup-meta { display: flex; gap: 0.75rem; font-size: 0.65rem; color: var(--muted); flex-wrap: wrap; margin-bottom: 0.5rem; }
  .popup-del { background: none; border: 1px solid #3a1a1a; color: #ff6b6b88; border-radius: 5px; padding: 0.25rem 0.65rem; font-size: 0.65rem; cursor: pointer; font-family: var(--font-mono); width: 100%; }
  .popup-del:hover { color: #ff6b6b; border-color: #ff6b6b55; }
  ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-track { background: var(--bg); } ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">
      <div class="logo-icon">🔊</div>
      <div class="logo-text">
        <div class="logo-title">World Soundmarks</div>
        <div class="logo-sub">Global Soundscape Cartography</div>
      </div>
    </div>
    <div class="header-right">
      <div class="badge"><span id="count">0</span> marks</div>
      <div class="tab-group">
        <button class="tab active" id="tab-map" onclick="switchView('map')">🗺 Map</button>
        <button class="tab" id="tab-list" onclick="switchView('list')">📋 List</button>
      </div>
    </div>
  </header>
  <div id="filterbar">
    <span class="filter-label">FILTER:</span>
    <button class="fchip" data-cat="all" onclick="setFilter('all')" style="border-color:#f0a500;color:#f0a500;">All</button>
  </div>
  <div id="map-container">
    <div id="map"></div>
    <div id="hint"><div class="dot-pulse"></div> Click anywhere on the map to place a soundmark</div>
    <div id="search-box">
      <input type="text" id="search-input" placeholder="Search a place…" onkeydown="if(event.key==='Enter')searchPlace()" />
      <button id="search-btn" onclick="searchPlace()">Go</button>
    </div>
    <div id="list-view">
      <div class="list-empty" id="list-empty"><span class="em">🔇</span>No soundmarks yet.<br>Switch to map view to place some.</div>
    </div>
  </div>
</div>

<div id="modal-overlay">
  <div id="modal">
    <div class="modal-header">
      <div class="modal-tag"><div class="dot"></div><span>New Soundmark</span></div>
      <div class="modal-coords" id="modal-coords"></div>
      <div class="modal-place" id="modal-place"></div>
      <svg id="modal-wave" class="modal-wave" viewBox="0 0 100 100" preserveAspectRatio="none"><polyline id="modal-wave-line" fill="none" stroke-width="1.5"/></svg>
    </div>
    <div class="modal-body">
      <label>Sound Category</label>
      <div class="cat-grid" id="cat-grid"></div>
      <label>Sound Title *</label>
      <input type="text" id="f-title" placeholder="e.g. Dawn chorus in the Daintree Rainforest" />
      <label>Description</label>
      <textarea id="f-desc" placeholder="Describe what you hear, when, notable characteristics…"></textarea>
      <label>Intensity — <span id="intensity-label" style="color:#f0a500">Moderate</span></label>
      <input type="range" id="f-intensity" min="0" max="4" value="2" />
      <label>Your Name / Initials</label>
      <input type="text" id="f-name" placeholder="Anonymous" />
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-save" id="btn-save" onclick="saveMarker()" disabled>Place Soundmark</button>
      </div>
    </div>
  </div>
</div>

<script>
const CATS = [
  { id:"natural",    label:"Natural",        color:"#4ade80", icon:"🌿" },
  { id:"urban",      label:"Urban",           color:"#fb923c", icon:"🏙️" },
  { id:"human",      label:"Human Activity",  color:"#60a5fa", icon:"👥" },
  { id:"mechanical", label:"Mechanical",       color:"#f472b6", icon:"⚙️" },
  { id:"ambient",    label:"Ambient",          color:"#a78bfa", icon:"〰️" },
  { id:"silence",    label:"Silence / Quiet", color:"#94a3b8", icon:"🤫" },
];
const INTENSITY = ["Very Quiet","Quiet","Moderate","Loud","Very Loud"];

let markers = JSON.parse(localStorage.getItem("soundmarks-world") || "[]");
let activeFilter = "all", pendingLatLng = null, pendingPlace = "", selectedCat = "natural";
let leafletMarkers = {}, currentView = "map";

const map = L.map("map", { center:[20,0], zoom:2, minZoom:2 });
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors', maxZoom:19
}).addTo(map);

map.on("click", e => {
  pendingLatLng = e.latlng;
  document.getElementById("modal-place").textContent = "📍 Locating…";
  openModal(e.latlng, "");
  reverseGeocode(e.latlng).then(place => {
    pendingPlace = place;
    document.getElementById("modal-place").textContent = place ? "📍 " + place : "";
  });
});

async function reverseGeocode(latlng) {
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${latlng.lat}&lon=${latlng.lng}&format=json`);
    const d = await r.json();
    const a = d.address || {};
    return [a.city||a.town||a.village||a.hamlet||a.county, a.country].filter(Boolean).join(", ") || "Unknown location";
  } catch { return ""; }
}

async function searchPlace() {
  const q = document.getElementById("search-input").value.trim();
  if (!q) return;
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=1`);
    const d = await r.json();
    if (d.length) map.setView([+d[0].lat, +d[0].lon], 12);
    else alert("Place not found.");
  } catch { alert("Search failed."); }
}

// Build filter chips
const filterbar = document.getElementById("filterbar");
CATS.forEach(c => {
  const btn = document.createElement("button");
  btn.className = "fchip"; btn.dataset.cat = c.id;
  btn.innerHTML = `${c.icon} ${c.label} (<span id="fc-${c.id}">0</span>)`;
  btn.onclick = () => setFilter(c.id);
  filterbar.appendChild(btn);
});

// Build category grid
const catGrid = document.getElementById("cat-grid");
CATS.forEach(c => {
  const btn = document.createElement("button");
  btn.className = "cat-btn"; btn.dataset.cat = c.id;
  btn.innerHTML = `${c.icon} ${c.label}`;
  btn.onclick = () => selectCat(c.id);
  catGrid.appendChild(btn);
});
selectCat("natural");

document.getElementById("f-intensity").oninput = e => {
  const cat = CATS.find(c => c.id === selectedCat);
  document.getElementById("intensity-label").textContent = INTENSITY[e.target.value];
  document.getElementById("intensity-label").style.color = cat.color;
};
document.getElementById("f-title").oninput = e => {
  document.getElementById("btn-save").disabled = !e.target.value.trim();
};

function buildWave() {
  return Array.from({length:60},(_,i)=>`${(i/59)*100},${50+Math.sin(i*0.7)*20+Math.sin(i*1.3)*12+Math.sin(i*2.1)*8}`).join(" ");
}
function setWave(color) {
  const l = document.getElementById("modal-wave-line");
  l.setAttribute("points", buildWave()); l.setAttribute("stroke", color);
}

function makeIcon(cat, intensity) {
  const c = CATS.find(x => x.id === cat) || CATS[0];
  const r = 12 + intensity * 3;
  return L.divIcon({
    html: `<svg xmlns='http://www.w3.org/2000/svg' width='${r*2+8}' height='${r*2+8}'><circle cx='${r+4}' cy='${r+4}' r='${r}' fill='${c.color}44' stroke='${c.color}' stroke-width='2' style='filter:drop-shadow(0 0 6px ${c.color})'/><text x='${r+4}' y='${r+8}' text-anchor='middle' font-size='${r}'>${c.icon}</text></svg>`,
    className:"", iconSize:[r*2+8,r*2+8], iconAnchor:[r+4,r+4]
  });
}

function popupHTML(m) {
  const cat = CATS.find(c => c.id === m.category) || CATS[0];
  return `<svg class='popup-wave' viewBox='0 0 100 100' preserveAspectRatio='none'><polyline points='${buildWave()}' fill='none' stroke='${cat.color}' stroke-width='1.5' opacity='0.6'/></svg>
    <div class='popup-cat' style='color:${cat.color}'>${cat.icon} ${cat.label}</div>
    <div class='popup-title'>${m.title}</div>
    ${m.place?`<div class='popup-place'>📍 ${m.place}</div>`:""}
    ${m.description?`<div class='popup-desc'>${m.description}</div>`:""}
    <div class='popup-meta'><span>Intensity: <b style='color:${cat.color}'>${INTENSITY[m.intensity]}</b></span><span>By: ${m.contributor||"Anonymous"}</span><span>${new Date(m.date).toLocaleDateString()}</span></div>
    <button class='popup-del' onclick='deleteMarker("${m.id}")'>Remove Marker</button>`;
}

function renderMarkers() {
  Object.values(leafletMarkers).forEach(lm => map.removeLayer(lm));
  leafletMarkers = {};
  (activeFilter==="all" ? markers : markers.filter(m=>m.category===activeFilter)).forEach(m => {
    const lm = L.marker(m.position, {icon:makeIcon(m.category, m.intensity)}).addTo(map).bindPopup(popupHTML(m),{maxWidth:280});
    leafletMarkers[m.id] = lm;
  });
  updateUI();
}

function updateUI() {
  document.getElementById("count").textContent = markers.length;
  CATS.forEach(c => { const el=document.getElementById(`fc-${c.id}`); if(el) el.textContent=markers.filter(m=>m.category===c.id).length; });
  document.querySelector('[data-cat="all"]').innerHTML = `All (${markers.length})`;
  renderListView();
}

function renderListView() {
  const container = document.getElementById("list-view");
  container.querySelectorAll(".list-card").forEach(c=>c.remove());
  const filtered = activeFilter==="all" ? markers : markers.filter(m=>m.category===activeFilter);
  document.getElementById("list-empty").style.display = filtered.length===0?"block":"none";
  filtered.forEach(m => {
    const cat = CATS.find(c=>c.id===m.category)||CATS[0];
    const card = document.createElement("div");
    card.className="list-card"; card.style.borderColor=cat.color+"33";
    card.innerHTML=`<div class='list-card-header' style='background:linear-gradient(135deg,${cat.color}15,transparent)'>
      <svg class='list-card-wave' viewBox='0 0 100 100' preserveAspectRatio='none'><polyline points='${buildWave()}' fill='none' stroke='${cat.color}' stroke-width='1.5' opacity='0.5'/></svg>
      <div class='list-card-cat' style='color:${cat.color}'>${cat.icon} ${cat.label}</div>
      <div class='list-card-title'>${m.title}</div>
      ${m.place?`<div class='list-card-loc'>📍 ${m.place}</div>`:""}
    </div>
    ${m.description?`<div class='list-card-desc'>${m.description}</div>`:""}
    <div class='list-card-meta'>
      <span style='color:${cat.color}'>${INTENSITY[m.intensity]}</span>
      <span>${m.contributor||"Anonymous"}</span>
      <span>${new Date(m.date).toLocaleDateString()}</span>
      <button class='list-card-del' onclick='deleteMarker("${m.id}")'>Remove</button>
    </div>`;
    container.appendChild(card);
  });
}

function setFilter(cat) {
  activeFilter = cat;
  document.querySelectorAll(".fchip").forEach(btn => {
    const bc=btn.dataset.cat, c=CATS.find(x=>x.id===bc), color=bc==="all"?"#f0a500":(c?c.color:"#f0a500");
    if(bc===cat){btn.classList.add("active");btn.style.color=color;btn.style.borderColor=color;btn.style.background=color+"22";}
    else{btn.classList.remove("active");btn.style.color="";btn.style.borderColor="";btn.style.background="";}
  });
  renderMarkers();
}

function openModal(latlng, place) {
  document.getElementById("modal-overlay").classList.add("visible");
  document.getElementById("modal-coords").textContent = `${latlng.lat.toFixed(5)}°, ${latlng.lng.toFixed(5)}°`;
  document.getElementById("f-title").value=""; document.getElementById("f-desc").value="";
  document.getElementById("f-intensity").value=2; document.getElementById("f-name").value="";
  document.getElementById("intensity-label").textContent="Moderate";
  document.getElementById("btn-save").disabled=true;
  selectCat("natural");
}
function closeModal() { document.getElementById("modal-overlay").classList.remove("visible"); pendingLatLng=null; pendingPlace=""; }

function selectCat(id) {
  selectedCat=id;
  const cat=CATS.find(c=>c.id===id);
  document.querySelectorAll(".cat-btn").forEach(btn => {
    const bc=btn.dataset.cat, c=CATS.find(x=>x.id===bc);
    if(bc===id){btn.style.borderColor=c.color;btn.style.color=c.color;btn.style.background=c.color+"22";}
    else{btn.style.borderColor="";btn.style.color="";btn.style.background="";}
  });
  setWave(cat.color);
  document.getElementById("intensity-label").style.color=cat.color;
  const s=document.getElementById("btn-save");
  s.style.background=`linear-gradient(135deg,${cat.color}cc,${cat.color}88)`;
  s.style.borderColor=cat.color; s.style.color="#fff";
}

function saveMarker() {
  const title=document.getElementById("f-title").value.trim();
  if(!title||!pendingLatLng) return;
  const m={
    id:`sm-${Date.now()}-${Math.random().toString(36).slice(2)}`,
    title, description:document.getElementById("f-desc").value.trim(),
    category:selectedCat, intensity:+document.getElementById("f-intensity").value,
    contributor:document.getElementById("f-name").value.trim(),
    position:[pendingLatLng.lat, pendingLatLng.lng],
    place:pendingPlace, date:new Date().toISOString()
  };
  markers.push(m);
  localStorage.setItem("soundmarks-world", JSON.stringify(markers));
  closeModal(); renderMarkers();
  setTimeout(()=>{ if(leafletMarkers[m.id]) leafletMarkers[m.id].openPopup(); },100);
}

function deleteMarker(id) {
  markers=markers.filter(m=>m.id!==id);
  localStorage.setItem("soundmarks-world", JSON.stringify(markers));
  if(leafletMarkers[id]){map.removeLayer(leafletMarkers[id]);delete leafletMarkers[id];}
  map.closePopup(); updateUI();
}

function switchView(v) {
  currentView=v;
  document.getElementById("tab-map").classList.toggle("active",v==="map");
  document.getElementById("tab-list").classList.toggle("active",v==="list");
  document.getElementById("list-view").classList.toggle("visible",v==="list");
  if(v==="map") map.invalidateSize();
}

setFilter("all"); renderMarkers();
</script>
</body>
</html>
